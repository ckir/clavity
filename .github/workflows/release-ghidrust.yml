name: release-ghidrust

# STANDALONE ghidrust release — the DISPATCH-ONLY escape hatch. The CANONICAL path is the umbrella
# clavity-v<N> release (umbrella-release.yml), which now bundles ghidrust-setup alongside dotnet + classic.
# Use this only to cut a standalone ghidrust-v<N> without a full clavity cut. Lives on MAIN; builds the
# tool from its subfolder on main via ./.github/workflows/build-ghidrust.yml; shares the live-E2E gate via
# e2e-ghidrust.yml. The `push: tags: ghidrust-v*` trigger was REMOVED so a stray tag cannot fire a
# split-brain out-of-band release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. ghidrust-v2) — REQUIRED.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-ghidrust
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-ghidrust.yml

  e2e:
    # Live pre-publish gate (B), a SHARED reusable workflow (e2e-ghidrust.yml) so this path and the
    # umbrella use ONE definition. `needs: build` so a broken build never pays the ~573 MB Ghidra download;
    # both tools now build from the same main checkout, so no ref pass-through is needed.
    needs: [build]
    uses: ./.github/workflows/e2e-ghidrust.yml

  publish:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      - name: Assemble release notes
        id: notes
        shell: bash
        env:
          # Pass the dispatch-supplied tag via env, NOT inline ${{…}} interpolation, so a crafted
          # workflow_dispatch input cannot inject shell (Actions script-injection hardening). ref_name on a
          # tag push is constrained by the tag ruleset, so it stays inline.
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cat > body.md <<EOF
          # ghidrust $TAG

          | tool | version | source |
          |------|---------|--------|
          | ghidrust | ${{ needs.build.outputs.version }} | main@${{ needs.build.outputs.sha }} |

          Installer is **unsigned** (Windows SmartScreen may warn: *More info -> Run anyway*).
          Verify the \`.sha256\` against the \`.exe\` before running.
          EOF

      - name: Publish the ghidrust release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body_path: body.md
          make_latest: false   # D2/§6: only the clavity flagship claims the "Latest" badge
          files: |
            dist/ghidrust-setup-*.exe
            dist/ghidrust-setup-*.exe.sha256
