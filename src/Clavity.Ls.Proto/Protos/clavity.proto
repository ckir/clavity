syntax = "proto3";

// EMPIRICALLY-DERIVED contract for Antigravity's local Language Server.
//
// Service name + method are REAL (extracted from agy.exe strings):
//   /exa.language_server_pb.LanguageServerService/GetConversationMetadata
// Message FIELD NUMBERS are VERIFIED against a live relay capture (agy 1.0.11) — the golden bytes
// in tests/Clavity.Ls.Tests/TestData pin them. Message and field NAMES are reconstructed from the
// wire (agentapi renders JSON, not the wire), so names may not match agy's real .proto; only the
// field numbers + wire types are load-bearing. This is version-fragile — re-verify on agy updates.
//
// Scope: GetConversationMetadata (T5) and GetCascadeTrajectory (T6) from wire capture. SendUserCascadeMessage
// and WaitForConversationFullyIdle were added in T7 from the public schema (jkfujinami/antigravity-grpc-schemas);
// field numbers verified against that schema. The other LanguageServerService RPCs are added per-task as needed.

package exa.language_server_pb;

option csharp_namespace = "Clavity.Ls.Proto";

import "google/protobuf/timestamp.proto";

service LanguageServerService {
  rpc GetConversationMetadata(GetConversationMetadataRequest) returns (GetConversationMetadataResponse);
  rpc GetCascadeTrajectory(GetCascadeTrajectoryRequest) returns (GetCascadeTrajectoryResponse);
  rpc SendUserCascadeMessage(SendUserCascadeMessageRequest) returns (SendUserCascadeMessageResponse);
  rpc WaitForConversationFullyIdle(WaitForConversationFullyIdleRequest) returns (WaitForConversationFullyIdleResponse);
  rpc GetAllCascadeTrajectories(GetAllCascadeTrajectoriesRequest) returns (GetAllCascadeTrajectoriesResponse);
}

message GetConversationMetadataRequest {
  string conversation_id = 1;
}

// Top-level response. field 1 carries the metadata object directly (verified: response gRPC message
// begins 0a a1 05 = field 1, len 673). agentapi's JSON labels an extra "conversationMetadata"/"metadata"
// nesting that does not correspond to separate wire levels here.
message GetConversationMetadataResponse {
  Metadata metadata = 1;
}

message Metadata {
  repeated Workspace workspaces = 1;
  // 2 = created_at (Timestamp) — skipped (unknown field), not asserted.
  string initialization_state_id = 3;
  // 4/5 = parent ids — skipped.
  string root_conversation_id = 6;
  repeated string workspace_uris = 7;
  // 15, 18, ... = mendel experiment ids / project id — skipped.
}

message Workspace {
  string workspace_folder_absolute_uri = 1;
  string git_root_absolute_uri = 2;
  Repository repository = 3;
  string branch_name = 4;
}

message Repository {
  string computed_name = 1;
  string git_origin_url = 2;
}

// --- GetCascadeTrajectory (T6): the agentic transcript for a cascade. PARTIAL — only the fields BoundedView
// reads are modeled; protobuf skips the rest (same discipline as the metadata subset above). Field NUMBERS are
// verified against the captured golden tests/Clavity.Ls.Tests/TestData/GetCascadeTrajectory.bin AND the public
// schema (memory agy-ls-proto-public-sources): response top-level = gemini_coder.Trajectory + counts. The
// trajectory/step INTERNAL names are reconstructed from the wire (only numbers are load-bearing).
message GetCascadeTrajectoryRequest {
  string cascade_id = 1;
  // 2 = verbosity (ClientTrajectoryVerbosity) — omitted; agy returns the full trajectory without it.
}

message GetCascadeTrajectoryResponse {
  CascadeTrajectory trajectory = 1;            // public: gemini_coder.Trajectory
  // 2 = status (exa.cortex_pb.CascadeRunStatus) — skipped (unknown field).
  uint32 num_total_steps = 3;
  uint32 num_total_generator_metadata = 4;
  uint32 num_total_executor_metadata = 5;
}

message CascadeTrajectory {                     // partial of gemini_coder.Trajectory
  string cascade_id = 1;
  repeated CascadeStep steps = 2;
  // 3 = generator metadata (repeated), 4/6/7/8/9 = other — skipped.
}

message CascadeStep {                           // partial
  int32 kind = 1;                               // step-kind enum (verified: 14=user input, others assistant/tool).
  // 4 = ?, 5 = step metadata (ids/timestamps/run-status) — skipped.
  CascadeUserInput user_input = 19;             // present only on user-message steps.
}

message CascadeUserInput {                      // partial — step field 19
  string text = 2;
  // 3 = { 1: formatted text }, 4, 12 = other — skipped.
}

// --- SendUserCascadeMessage (T7): post a user message into a cascade. Field numbers verified against the
// public antigravity schema (jkfujinami/antigravity-grpc-schemas). PARTIAL — only the fields we set/need are
// modeled. ⚠ LIVE this RPC consumes quota AND injects a visible message into the user's agy; only the in-proc
// fake LS exercises it before T10.
message TextOrScopeItem {                       // partial of exa.codeium_common_pb.TextOrScopeItem
  oneof chunk {
    string text = 1;
    // 2 = ContextScopeItem item — skipped (we only send plain text).
  }
}

message SendUserCascadeMessageRequest {         // partial
  string cascade_id = 1;
  repeated TextOrScopeItem items = 2;
  // 3 metadata, 4 experiment_config, 17/19 other configs, 6..23 others — skipped (not set).
  CascadeConfig cascade_config = 5;             // carries the model spec; REQUIRED live (see below).
  bool blocking = 8;
}

// EMPTY by contract: the reply is NOT returned here. Read it via GetCascadeTrajectory after
// WaitForConversationFullyIdle.
message SendUserCascadeMessageResponse {
}

// --- Model spec for SendUserCascadeMessage (T10): the LIVE LS REJECTS a send with no model
// ("failed to construct executor: neither PlanModel nor RequestedModel specified") — the in-proc fake
// never enforced this, so it surfaced only on the live write. Partial models of exa.cortex_pb.CascadeConfig /
// CascadePlannerConfig and exa.codeium_common_pb.ModelOrAlias / ModelAlias — ONLY the path we set:
//   cascade_config.planner_config.requested_model.alias = MODEL_ALIAS_RECOMMENDED.
// Field numbers raw-byte-verified against the agy-1.0.11-matched jkfujinami revision 753169f. Wire-compatible
// despite the local package (protobuf encodes field numbers + wire types, not type names).
message CascadeConfig {                          // partial of exa.cortex_pb.CascadeConfig
  CascadePlannerConfig planner_config = 1;
}

message CascadePlannerConfig {                   // partial of exa.cortex_pb.CascadePlannerConfig
  // 1 = Model plan_model — requested_model alone satisfies the live "specify a model" check.
  ModelOrAlias requested_model = 15;
}

message ModelOrAlias {                           // partial of exa.codeium_common_pb.ModelOrAlias
  oneof choice {
    Model model = 1;                             // concrete id; 1.0.11 REJECTS the alias path live
    // 2 = ModelAlias alias — live error: "model aliases are no longer supported".
  }
}

enum Model {                                     // partial of exa.codeium_common_pb.Model
  MODEL_UNSPECIFIED = 0;
  // 1037 = key "gemini-3.1-pro-high" / label "Gemini 3.1 Pro (High)" — the user-selected model for the seeded
  // conversation. Concrete value REQUIRED (1.0.11 dropped aliases). The int is the agy-1.0.11 REGISTRY id read
  // live via GetAvailableModels — NOT jkfujinami's enum (whose 353=Riftrunner gave "unknown model key" live).
  MODEL_GEMINI_3_1_PRO_HIGH = 1037;
}

// --- WaitForConversationFullyIdle (T7): block until the conversation stops producing steps.
message WaitForConversationFullyIdleRequest {
  string conversation_id = 1;
  int32 inactivity_timeout_seconds = 2;
  int32 stabilization_duration_seconds = 3;
  bool return_on_executor_error = 4;
}

message WaitForConversationFullyIdleResponse {
  bool timed_out = 1;
}

// --- GetAllCascadeTrajectories (multi-session): the conversation ids this LS instance knows. Used to resolve
// the per-pair conversation id from the LS (not from disk). PARTIAL — CascadeTrajectorySummary models only the
// tiebreaker timestamp. Field numbers from jkfujinami/antigravity-grpc-schemas; pinned by a live golden.
message GetAllCascadeTrajectoriesRequest {
  bool exclude_subtrajectories = 1;
}

message GetAllCascadeTrajectoriesResponse {
  // map KEY = conversation id; VALUE = its summary. Top-level trajectories only when exclude_subtrajectories.
  map<string, CascadeTrajectorySummary> trajectory_summaries = 1;
}

message CascadeTrajectorySummary {            // partial of exa.jetski_cortex_pb.CascadeTrajectorySummary
  // 1 = summary, 2 = step_count — skipped (not needed).
  google.protobuf.Timestamp last_modified_time = 3;   // >1-conversation tiebreaker (spec §6).
}
