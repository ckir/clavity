name: republish-member

# Decoupled per-member republish (Acceptance #11 / C8 "Release coupling — decoupled by design"):
# rebuild ONE member and republish its assets onto an EXISTING clavity-v<N> release, without any
# sibling's build/gate passing. Use this for a hotfix on one member after umbrella-release.yml
# already published that tag (e.g. a flaky classic build must not block an unrelated dotnet-only fix
# from reaching the SAME release page). ghidrust was fully retired 2026-09-14, so only dotnet and
# classic remain republishable (agy-autotrain/commonmemory install via `claude plugin`, no release asset).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing clavity-v<N> release tag to republish onto (e.g. clavity-v3) — REQUIRED.'
        required: true
        type: string
      member:
        description: 'Which member to rebuild and republish.'
        required: true
        type: choice
        # Only members that ship a release asset are listed. agy-autotrain + commonmemory install via
        # `claude plugin marketplace add ckir/clavity` (no asset); ghidrust was fully retired 2026-09-14.
        options:
          - dotnet
          - classic

permissions:
  contents: write

jobs:
  dotnet:
    if: inputs.member == 'dotnet'
    uses: ./.github/workflows/build-dotnet.yml

  classic:
    if: inputs.member == 'classic'
    uses: ./.github/workflows/build-classic.yml

  publish:
    # Finding-3 fold: GitHub Actions SKIPS a downstream job by default when ANY of its `needs`
    # jobs was skipped — so with the non-selected build jobs skipped (only the selected member ran),
    # the default condition would skip `publish` entirely and NOTHING would republish. The explicit
    # `if:` below overrides that: run as long as the job wasn't cancelled and NONE of the needs
    # actually FAILED (a skipped need is tolerated; a real failure of the one member that ran is
    # not). Only the selected member's assets are downloaded/published (see the `member` switch
    # in the steps), so republishing one member never touches a sibling's assets.
    needs: [dotnet, classic]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine which build job ran + its artifact name
        id: which
        shell: bash
        run: |
          case "${{ inputs.member }}" in
            dotnet)        echo "artifact=dotnet-bin-*" >> "$GITHUB_OUTPUT"; echo "pattern=true" >> "$GITHUB_OUTPUT" ;;  # retired Inno -> 4 per-RID binary tarballs
            classic)       echo "artifact=${{ needs.classic.outputs.artifact-name }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Download the rebuilt asset (single-name members)
        if: ${{ steps.which.outputs.pattern != 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.which.outputs.artifact }}
          path: dist-member

      - name: Download the rebuilt assets (dotnet, multi-RID binaries)
        if: ${{ steps.which.outputs.pattern == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ steps.which.outputs.artifact }}
          path: dist-member
          merge-multiple: true

      - name: Republish onto the existing release (adds/overwrites only this member's 2 assets)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            dist-member/*
