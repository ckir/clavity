name: release-clavity

# The clavity PRODUCT release (one of several tools in this umbrella repo — NOT the only release). A
# serial clavity-v<N> tag bundles clavity's two mutually-exclusive variants' installers into one GitHub
# Release named "clavity". Other tools release independently via their own release-<tool>.yml (see
# docs/hosting-a-tool.md). The file keeps its umbrella-release.yml name to avoid doc-drift (it is
# referenced by name in CONTRIBUTING.md and build-dotnet.yml).
on:
  push:
    tags:
      - 'clavity-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Serial umbrella tag for the release (e.g. clavity-v2) — REQUIRED on dispatch; a dispatch has no triggering tag.'
        required: true
        type: string
      classic_ref:
        description: 'classic-branch commit SHA to bundle (blank = current clavity-classic tip)'
        required: false
        type: string
        default: ''

permissions:
  contents: write   # publish job creates the Release + uploads assets

concurrency:
  # A publish pipeline creates a release object then uploads 4 assets sequentially (not atomic). Never cancel a
  # run mid-upload (would leave a PARTIAL public release) — queue instead.
  group: release-clavity
  cancel-in-progress: false

jobs:
  resolve-classic:
    # Pin the classic commit ONCE, at cut time, so a re-run weeks later rebuilds the SAME snapshot.
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
    steps:
      - id: r
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.classic_ref }}" ]; then
            sha="${{ github.event.inputs.classic_ref }}"
          else
            sha=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/clavity-classic | cut -f1)
          fi
          if [ -z "$sha" ]; then echo "::error::could not resolve clavity-classic SHA"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "resolved classic sha=$sha"

  dotnet:
    uses: ./.github/workflows/build-dotnet.yml   # FILE ref = this tag's main commit (dotnet is already pinned by the tag)

  classic:
    needs: resolve-classic
    # NOTE: owner/repo is HARDCODED — GitHub Actions forbids expressions like ${{ github.repository }} in `uses:`.
    # A fork therefore calls THIS upstream reusable workflow (documented limitation, not worked around).
    uses: ckir/clavity/.github/workflows/build-classic.yml@clavity-classic
    with:
      ref: ${{ needs.resolve-classic.outputs.sha }}   # CODE checkout is PINNED to the resolved SHA

  resolve-ghidrust:
    # Pin the ghidrust tool-branch commit ONCE at cut time (mirrors resolve-classic / D7 SHA-pin).
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
    steps:
      - id: r
        shell: bash
        run: |
          sha=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/ghidrust | cut -f1)
          if [ -z "$sha" ]; then echo "::error::could not resolve ghidrust SHA"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "resolved ghidrust sha=$sha"

  ghidrust:
    needs: resolve-ghidrust
    # owner/repo HARDCODED (Actions forbids expressions in `uses:`); CODE checkout SHA-pinned via ref (D7).
    uses: ckir/clavity/.github/workflows/build-ghidrust.yml@ghidrust
    with:
      ref: ${{ needs.resolve-ghidrust.outputs.sha }}

  e2e-ghidrust:
    # BLOCKING live-E2E gate — the flagship vouches for the ghidrust it ships (shared reusable workflow, one
    # definition with release-ghidrust.yml). `needs: ghidrust` so a broken build skips the ~573 MB Ghidra
    # download; passes the SAME SHA-pinned source the build built.
    needs: [resolve-ghidrust, ghidrust]
    uses: ./.github/workflows/e2e-ghidrust.yml
    with:
      ref: ${{ needs.resolve-ghidrust.outputs.sha }}

  publish:
    # Atomic all-or-nothing: a broken/failed-E2E ghidrust blocks the whole clavity release (no continue-on-error).
    needs: [dotnet, classic, ghidrust, e2e-ghidrust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dotnet installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.dotnet.outputs.artifact-name }}
          path: dist-dotnet

      - name: Download classic installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.classic.outputs.artifact-name }}
          path: dist-classic

      - name: Download ghidrust installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ghidrust.outputs.artifact-name }}
          path: dist-ghidrust

      - name: Assemble release assets + notes
        id: notes
        shell: bash
        run: |
          # Effective umbrella tag: the triggering tag on push; the required `tag` input on dispatch (a dispatch
          # has no triggering tag, so github.ref_name would wrongly be 'main').
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp dist-dotnet/* out/
          cp dist-classic/* out/
          cp dist-ghidrust/* out/
          echo "assets in release:"; ls -1 out
          cat > body.md <<EOF
          # clavity $TAG

          | component | version | source |
          |-----------|---------|--------|
          | clavity-dotnet  | ${{ needs.dotnet.outputs.version }}  | main@${{ needs.dotnet.outputs.sha }} |
          | clavity-classic | ${{ needs.classic.outputs.version }} | clavity-classic@${{ needs.classic.outputs.sha }} |
          | ghidrust        | ${{ needs.ghidrust.outputs.version }} | ghidrust@${{ needs.ghidrust.outputs.sha }} |

          **clavity-dotnet** and **clavity-classic** are the two **mutually exclusive** clavity variants — install
          ONE. **ghidrust** is a separate tool (install alongside either). Installers are **unsigned** (Windows
          SmartScreen may warn on first run: *More info -> Run anyway*). Verify each \`.sha256\` against its \`.exe\`.
          EOF
          echo "wrote body.md"

      - name: Publish ONE clavity release (all installers)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}   # explicit: correct on BOTH tag-push and dispatch (no ref tag)
          name: ${{ steps.notes.outputs.tag }}        # e.g. "clavity-v1" — the umbrella IS the clavity release (avoid doubling "clavity")
          body_path: body.md
          files: |
            out/clavity-dotnet-setup-*.exe
            out/clavity-dotnet-setup-*.exe.sha256
            out/clavity-classic-setup-*.exe
            out/clavity-classic-setup-*.exe.sha256
            out/ghidrust-setup-*.exe
            out/ghidrust-setup-*.exe.sha256
