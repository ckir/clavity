# markup link checker (becheran/mlc) — see `just check-links`.
#
# Scope: TRACKED PRODUCT DOCS ONLY. Everything ignored below is either not ours,
# not tracked, or deliberately frozen — a link error in those is noise that would
# train us to ignore the whole report.

# Vendored / not our code.
ignore-path = [
  "clavity-classic/agy-mcp-bridge/.venv",
  "node_modules",

  # Gitignored working artifacts. They do not exist in a fresh clone, and they
  # legitimately reference paths that only resolve on the maintainer's box.
  "docs/superpowers",
  ".clavity",
  # docs-rationalize audit tool (SP2) generated artifacts — they reference code:line and doc paths that
  # are not links; they are gitignored working files, absent in a fresh clone. Never link-checked.
  "docs/docs-audit-findings.md",
  "docs/docs-audit-log.md",

  # Build output. NOTE: mlc's ignore-path matches a LITERAL path from the scan root — it is NOT a
  # glob. Measured: a bare "target" ignores only a root-level ./target (which never forms here, as
  # each member owns its own workspace), and "**/target" matches nothing at all. So every build dir
  # must be enumerated by its real relative path, for EVERY member — Rust `target/` and .NET
  # `bin/`+`obj/` alike. Add lines here whenever a new member or project lands.
  "commonmemory/dist",
  "clavity-classic/target",
  "ghidrust/target",
  "clavity-dotnet/src/Clavity.Cli/bin",
  "clavity-dotnet/src/Clavity.Cli/obj",
  "clavity-dotnet/src/Clavity.Ls/bin",
  "clavity-dotnet/src/Clavity.Ls/obj",
  "clavity-dotnet/src/Clavity.Ls.Proto/bin",
  "clavity-dotnet/src/Clavity.Ls.Proto/obj",
  "clavity-dotnet/src/Clavity.Mcp/bin",
  "clavity-dotnet/src/Clavity.Mcp/obj",
  "clavity-dotnet/tests/Clavity.Integration.Tests/bin",
  "clavity-dotnet/tests/Clavity.Integration.Tests/obj",
  "clavity-dotnet/tests/Clavity.Live.Acceptance/bin",
  "clavity-dotnet/tests/Clavity.Live.Acceptance/obj",
  "clavity-dotnet/tests/Clavity.Ls.Tests/bin",
  "clavity-dotnet/tests/Clavity.Ls.Tests/obj",
]

# Offline by default: no network calls for external URLs. Two consequences worth
# knowing before you "fix" a reported error:
#
# 1. GitHub-relative release links (`../../releases` from the root README,
#    `../../../releases` from a member README) are CORRECT and resolve properly
#    under GitHub rendering — the blob/<branch>/ prefix supplies the extra depth.
#    An offline filesystem check cannot see that, so it reports them. Do NOT
#    "fix" them into something that breaks on GitHub.
# 2. Bracketed prose such as `[PHASE: EXECUTION]` or `[⚠️ CRITICAL ANTI-PATTERNS]`
#    is parsed as a markdown reference link and warns. Those are labels, not links.
#
# Expected baseline: 2 errors, both from (1) above. The knowledge/ manuals used to add two more via a
# relative sibling link that could not resolve from both plugin depths; that link is now absolute, so
# any third error is a genuine regression.
offline = true
