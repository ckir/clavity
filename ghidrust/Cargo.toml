[workspace]
resolver = "2"
members = [
    "crates/ghidrust-mcp",
    "crates/ghidra-ipc",
    "crates/ghidra-worker-ctl",
]

[workspace.package]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.58", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
] }
sha2 = "0.10"
