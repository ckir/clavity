# clavity monorepo git hooks (lefthook). Install once per clone: `lefthook install`.
#
# pre-push: full lint gate across every tool (mirrors each tool's CI lint) — catches fmt/clippy/compile
#   breaks locally BEFORE a CI bounce, which matters in an agent-driven repo. Requires each tool's lint
#   tools; for ghidrust run `just ghidrust::setup` once (cargo-nextest + cargo-deny). No Rust/.NET
#   pre-commit friction.
#
# pre-commit: Python-bridge hygiene, folded here from the former clavity-classic/lefthook.yml — ruff
#   check --fix + format on staged Python files only (pure Rust/.NET commits untouched). lint + format
#   run as ONE sequential command on purpose: both rewrite staged files, so parallel runs race.
# A pre-push hook MUST be fast. Git opens the remote SSH connection BEFORE running this hook, then leaves
# it idle for however long the hook takes. `lint` (~2 min: dotnet build + clippy x2 + cargo deny) and
# `scripts-tests` (~3 min: full Pester suite) used to live here, and the combined 5-10 min idle made GitHub
# hang up mid-push — observed as "Connection to ssh.github.com closed by remote host." after every gate had
# already passed, with nothing ever pushed. Both still run in CI, and release.ps1's own pre-flight runs them
# again before it pushes, so removing them here loses no coverage on the release path. Keep every job below
# in the SECONDS range; anything slower belongs in CI or an explicit pre-flight, never in a hook that holds
# a live connection open.
pre-push:
  commands:
    seed-sync:
      run: just seed-sync-check
    doc-stubs:
      run: just check-doc-stubs
    member-docs:
      run: just check-member-docs
    user-facing-docs:
      run: just check-user-facing-docs
    register-hash:
      run: just check-register-hash
    installer-ascii:
      # ~6s, nearly all pwsh startup. Earns its place: pwsh 7 defaults to UTF-8, so a BOM-less
      # non-ASCII .ps1 in the end-user installer surface is invisible to every OTHER local gate and
      # only misbehaves on a stock Windows PowerShell 5.1 box.
      run: just check-installer-ascii
    check-versions:
      # ONE pwsh process for all five members, not five. Same checks, same order, same fail-fast, same
      # exit code — but the old `&&` chain of five `pwsh -File` calls spent ~30s of its ~34s on pwsh
      # cold starts alone (~6s each, as the installer-ascii note above measures). Every one of those
      # seconds was idle time on the SSH connection git opens BEFORE this hook runs, which is exactly
      # the window the header warns about. Measured: 33.7s -> ~7s, hook total 62.5s -> ~36s.
      run: pwsh -File scripts/check-versions-all.ps1
pre-commit:
  commands:
    ruff:
      # Two patterns, not one: lefthook's doublestar treats a bare "**/*.py" as requiring 1+
      # path segments before the filename, so it does NOT match top-level files directly in
      # agy-mcp-bridge/ (server.py, agy_bus.py, telemetry.py, ...) — only nested ones (tests/*.py).
      # Verified empirically: "clavity-classic/agy-mcp-bridge/**/*.py" alone skipped a staged
      # top-level probe file (lefthook reported "no files for inspection"); adding the sibling
      # "*.py" pattern below fixed it (probe was reformatted as expected).
      glob:
        - "clavity-classic/agy-mcp-bridge/*.py"
        - "clavity-classic/agy-mcp-bridge/**/*.py"
      run: uv run --project clavity-classic/agy-mcp-bridge ruff check --fix {staged_files} && uv run --project clavity-classic/agy-mcp-bridge ruff format {staged_files}
      stage_fixed: true
