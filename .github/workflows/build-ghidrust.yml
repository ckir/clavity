name: build-ghidrust

# Reusable build+package block for the ghidrust release, minus publish. Called by release-ghidrust.yml
# and runnable via workflow_dispatch. Monorepo consolidation: code now lives under ghidrust/ on main;
# the checkout is naked (no branch/SHA pin) and the job runs from that folder.
on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      sha:
        value: ${{ jobs.build.outputs.sha }}
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ghidrust
    outputs:
      version: ${{ steps.ver.outputs.version }}
      sha: ${{ steps.sha.outputs.sha }}
      artifact-name: ghidrust-installer
    steps:
      - uses: actions/checkout@v7

      - name: Record the built commit
        id: sha
        shell: bash
        # Assign first, then echo: the `echo "sha=$(...)"` form discards git's exit code and can publish
        # a non-sha while the step stays green. Measured; full note in build-agy-autotrain.yml.
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Install build tools (just, nextest, cargo-deny)
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ghidrust

      - name: Extract version from .iss
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path installer/ghidrust.iss -Pattern '#define AppVersion "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TOOL_VER=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Lint gate
        shell: bash
        run: just lint

      - name: Test gate (live-worker tests self-skip without GHIDRUST_E2E)
        shell: bash
        run: just test

      - name: Build release binary
        shell: bash
        run: cargo build --release -p ghidrust-mcp

      - name: Stage binary into publish/
        shell: bash
        run: |
          mkdir -p publish
          cp target/release/ghidrust.exe publish/ghidrust.exe

      - name: --help smoke (usage + exit 0)
        shell: bash
        run: |
          # Guard that the shipped binary answers --help with usage and exit 0. ghidrust prints usage to
          # stderr; capture combined streams so the check stays robust regardless of which stream carries it.
          if ! out=$(./publish/ghidrust.exe --help 2>&1); then
            echo "ghidrust --help exited non-zero"; echo "$out"; exit 1
          fi
          [ -n "$out" ] || { echo "ghidrust --help produced no output"; exit 1; }
          echo "ghidrust --help OK:"; echo "$out"

      - name: Generate scoped marketplace.json (O3, single member)
        shell: pwsh
        run: ../scripts/generate-scoped-manifest.ps1 -MemberName ghidrust -OutFile installer/marketplace.install.json

      # Cohesive distribution model: the installer now ships its own plugin + a scoped local
      # marketplace, self-registering it (supersedes the old "two-channel" remote-marketplace note).

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Version consistency (binary + plugin classes)
        shell: pwsh
        run: pwsh -File ../scripts/check-versions.ps1 ghidrust && pwsh -File ../scripts/check-versions.ps1 ghidrust -Coverage

      - name: Build installer (ISCC)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc installer/ghidrust.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = "dist/ghidrust-setup-$env:TOOL_VER.exe"
          if (-not (Test-Path $setup)) { throw "$setup was not produced" }

      - name: Compute SHA-256 companion
        shell: pwsh
        run: |
          $name = "ghidrust-setup-$env:TOOL_VER.exe"
          $h = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          # LF-ONLY, NO BOM - `Set-Content` writes CRLF on Windows and GNU `sha256sum -c` then treats the
          # trailing \r as part of the filename. MEASURED 2026-08-26, coreutils 8.32: the CRLF form fails
          # with "No such file or directory" and exits 1 while the LF control passes. build-classic.yml has
          # always written it this way; these copies diverged silently.
          [IO.File]::WriteAllText("$PWD/dist/$name.sha256", "$h  $name`n")

      - name: Smoke — install/uninstall lifecycle + namespace (BLOCKING — first-ever for ghidrust)
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "dist/ghidrust-setup-$env:TOOL_VER.exe"
          $app = "$env:LOCALAPPDATA\Programs\ghidrust"

          $log = "$env:RUNNER_TEMP\ghidrust-install.log"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "===== ghidrust install.log (exit $($p.ExitCode)) ====="
            if (Test-Path $log) { Get-Content $log } else { Write-Host "(no log produced)" }
            throw "install exit $($p.ExitCode)"
          }
          # Finding-5: re-run the SAME installer — idempotent upgrade (remove-then-add) must exit 0.
          $p2 = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "re-run install exit $($p2.ExitCode) — idempotent upgrade must not abort" }
          if (-not (Test-Path "$app\ghidrust.exe")) { throw "ghidrust.exe missing" }
          if (-not (Test-Path "$app\.claude-plugin\marketplace.json")) { throw "marketplace.json not installed" }
          $manifest = Get-Content "$app\.claude-plugin\marketplace.json" -Raw | ConvertFrom-Json
          if ($manifest.name -ne 'clavity-ghidrust') { throw "expected marketplace name clavity-ghidrust (C9), got $($manifest.name)" }
          if ($manifest.plugins.Count -ne 1) { throw "expected 1 plugin, got $($manifest.plugins.Count)" }
          if ($manifest.plugins[0].source -ne './plugins/ghidrust') { throw "unexpected plugin source $($manifest.plugins[0].source)" }
          if (-not (Test-Path "$app\plugins\ghidrust")) { throw "plugins\ghidrust not staged" }
          # T5 - installed-tree manifest parity. A source-side check is a tautology for this defect
          # class: the packager dropping .claude-plugin\plugin.json leaves the source correct and only
          # the INSTALLED tree wrong. Hash equality, not a version comparison - a version compare would
          # false-RED this member specifically: ghidrust's plugin.json and .iss AppVersion are
          # deliberately independent equality classes (scripts/check-versions.ps1 'binary' vs 'plugin'),
          # so they differ on a correct build.
          #
          # NOTE: this gate does NOT structurally validate the source manifest; it relies on the
          # "Version consistency" step above having ConvertFrom-Json'd it and required a .version key.
          $srcManifest  = "plugin/.claude-plugin/plugin.json"
          $instManifest = "$app\plugins\ghidrust\.claude-plugin\plugin.json"
          if (-not (Test-Path $srcManifest -PathType Leaf))  { throw "T5: source manifest missing, or not a file, at $srcManifest - no expected value to compare against" }
          if (-not (Test-Path $instManifest -PathType Leaf)) { throw "T5 MANIFEST PARITY: $instManifest was not installed as a file (packager dropped .claude-plugin\plugin.json, or shipped a directory of that name)" }
          $srcHash  = (Get-FileHash $srcManifest  -Algorithm SHA256).Hash
          # Retry the INSTALLED file only: a real-time scanner can hold a transient read-lock on a file
          # the installer extracted moments ago. The source file is a plain checkout artifact and is not
          # subject to that, so it is hashed once above.
          $instHash = $null
          foreach ($attempt in 1..5) {
            try { $instHash = (Get-FileHash $instManifest -Algorithm SHA256).Hash; break }
            catch {
              if ($attempt -eq 5) { throw "T5 MANIFEST PARITY: could not read $instManifest after 5 attempts - $($_.Exception.Message)" }
              Start-Sleep -Milliseconds 400
            }
          }
          if ($srcHash -ne $instHash) { throw "T5 MANIFEST PARITY: installed manifest bytes differ from source (installed=$instHash source=$srcHash) - stale or rewritten plugin.json" }
          Write-Host "[T5] installed manifest parity OK ($instHash)"
          $userPath = (Get-ItemProperty "HKCU:\Environment" -Name Path -ErrorAction SilentlyContinue).Path
          if ($userPath -notlike "*$app*") { throw "PATH entry not added after install" }

          $uninst = Get-ChildItem $app -Filter "unins*.exe" | Select-Object -First 1
          Start-Process $uninst.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait | Out-Null
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path "$app\ghidrust.exe") -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path "$app\ghidrust.exe") { throw "uninstall did not complete within 30s" }
          $userPath2 = (Get-ItemProperty "HKCU:\Environment" -Name Path -ErrorAction SilentlyContinue).Path
          if ($userPath2 -like "*$app*") { throw "PATH entry not removed after uninstall" }
          "install/uninstall + namespace smoke PASSED"

      - name: Smoke — Bug 1 migration off the legacy 'clavity' marketplace (fake claude)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "dist/ghidrust-setup-$env:TOOL_VER.exe"
          $app = "$env:LOCALAPPDATA\Programs\ghidrust"
          $fakeDir = (Resolve-Path "../scripts/ci/fake-claude").Path
          $env:PATH = "$fakeDir;$env:PATH"                       # so the installer's `cmd /C claude` hits the fake
          $env:FAKE_CLAUDE_STATE = "$env:RUNNER_TEMP\fake-claude-migration.json"
          Remove-Item $env:FAKE_CLAUDE_STATE -ErrorAction SilentlyContinue
          '{ "marketplaces": { "clavity": "C:\\old\\clavity" }, "plugins": { "ghidrust@clavity": true } }' |
            Set-Content $env:FAKE_CLAUDE_STATE -Encoding utf8

          # This install EXITS 0 even when registration is skipped entirely (a non-registering install is
          # still a successful install), so the assertions below are the only failure signal - and without
          # the Inno log there is no way to tell WHY. The log carries the decisive line, emitted by
          # register-invoke.iss: "register-plugin.ps1 [install ghidrust] exit=N", where N is
          # 0=ok 2=partial 3=every detected agent failed (e.g. claude running) 4=NO agent detected.
          # Dump on ANY failure, not just a non-zero installer exit. Mirrors the lifecycle smoke above.
          $log = "$env:RUNNER_TEMP\ghidrust-migration.log"
          function Show-LogAndFail([string]$msg) {
            Write-Host "===== ghidrust migration install.log ====="
            if (Test-Path $log) { Get-Content $log } else { Write-Host "(no log produced)" }
            Write-Host "===== registrar verdict lines ====="
            if (Test-Path $log) {
              $hits = @(Select-String -Path $log -Pattern 'register-plugin\.ps1|AGENT ' | ForEach-Object { $_.Line })
              if ($hits.Count -gt 0) { $hits } else { Write-Host "(none - the registrar was never invoked)" }
            }
            throw $msg
          }

          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Show-LogAndFail "install exited $($p.ExitCode) with fake claude present" }

          # Detection is `Get-Command claude` on PATH (plus a ~/.claude fallback that does NOT exist on a
          # runner). If the shim is not reachable here, the registrar exits 4 and mutates nothing - which
          # is indistinguishable from a failed migration by the state file alone.
          $seen = (Get-Command claude -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          Write-Host "[preflight] 'claude' resolves to: $(if ($seen) { $seen } else { '(NOT RESOLVED)' })"

          $state = Get-Content $env:FAKE_CLAUDE_STATE -Raw | ConvertFrom-Json
          $mkts  = @($state.marketplaces.PSObject.Properties.Name)
          $plugs = @($state.plugins.PSObject.Properties.Name)
          Write-Host "[migration] marketplaces=$($mkts -join ','); plugins=$($plugs -join ',')"
          if ($plugs -notcontains 'ghidrust@clavity-ghidrust') { Show-LogAndFail "new registration ghidrust@clavity-ghidrust absent" }
          if ($mkts  -contains 'clavity') { Show-LogAndFail "MIGRATION FAILED: legacy 'clavity' marketplace still present" }
          Write-Host "Bug 1 migration smoke PASSED."
          $uninst = Get-ChildItem $app -Filter "unins*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($uninst) { Start-Process $uninst.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait | Out-Null }

      - name: "Smoke — Bug 2: refuse install while a claude.exe process is running"
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "dist/ghidrust-setup-$env:TOOL_VER.exe"
          $app = "$env:LOCALAPPDATA\Programs\ghidrust"
          # A process literally named claude.exe (a renamed cmd that idles), so ClaudeIsRunning()/tasklist sees it.
          $stubDir = Join-Path $env:RUNNER_TEMP "claude-stub"
          New-Item -ItemType Directory -Force -Path $stubDir | Out-Null
          $stub = Join-Path $stubDir "claude.exe"
          # Copy ping.exe DIRECTLY (not cmd.exe) so there is no child process to orphan — Stop-Process kills
          # the single renamed process cleanly. tasklist/GetProcessesByName see it as claude.exe.
          Copy-Item "$env:SystemRoot\System32\PING.EXE" $stub -Force
          $proc = Start-Process $stub -ArgumentList "-n","120","127.0.0.1" -WindowStyle Hidden -PassThru
          $log = "$env:RUNNER_TEMP\ghidrust-refuse.log"
          try {
            Start-Sleep -Seconds 1
            $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$log" -Wait -PassThru
            Write-Host "[refuse] installer exit $($p.ExitCode)"
            if ($p.ExitCode -eq 0) { throw "REFUSE FAILED: install exited 0 despite a running claude.exe" }
            if (Test-Path "$app\ghidrust.exe") { throw "REFUSE FAILED: files were installed despite a running claude.exe" }
            # Assert the non-zero exit is SPECIFICALLY our refuse (not an unrelated installer crash) — the
            # InitializeSetup MsgBox text is written to the Inno /LOG even under /SUPPRESSMSGBOXES.
            if (-not (Test-Path $log)) { throw "no install log produced — cannot confirm the refuse path fired" }
            if (-not (Select-String -Path $log -Pattern 'Claude Code is running' -Quiet)) {
              throw "REFUSE unconfirmed: non-zero exit but the log has no 'Claude Code is running' refuse message (possible unrelated failure)"
            }
            Write-Host "Bug 2 refuse smoke PASSED (aborted non-zero via the refuse path; no files placed)."
          }
          finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: "Smoke — Bug 2 (symmetric): refuse UNINSTALL while a claude.exe process is running"
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "dist/ghidrust-setup-$env:TOOL_VER.exe"
          $app = "$env:LOCALAPPDATA\Programs\ghidrust"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup for the uninstall smoke exited $($p.ExitCode)" }
          $uninst = Get-ChildItem $app -Filter "unins*.exe" | Select-Object -First 1
          $stubDir = Join-Path $env:RUNNER_TEMP "claude-stub-uninst"
          New-Item -ItemType Directory -Force -Path $stubDir | Out-Null
          $stub = Join-Path $stubDir "claude.exe"
          Copy-Item "$env:SystemRoot\System32\PING.EXE" $stub -Force
          $ulog = "$env:RUNNER_TEMP\ghidrust-uninst-refuse.log"
          $proc = Start-Process $stub -ArgumentList "-n","120","127.0.0.1" -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 1
            # Inno re-launches unins000 from %TEMP% and the wrapper returns INSTANTLY, so -Wait does not wait
            # for the real uninstall. Poll until no unins* child remains before asserting (else a BROKEN guard
            # false-passes on a timing race — the files just haven't been deleted yet).
            Start-Process $uninst.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$ulog" -Wait | Out-Null
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Process "unins*" -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
            if (-not (Test-Path "$app\ghidrust.exe")) { throw "UNINSTALL REFUSE FAILED: files removed despite a running claude.exe" }
            # Positive assertion (match the install smoke's rigor): the refuse message must be in the log.
            if (-not (Test-Path $ulog) -or -not (Select-String -Path $ulog -Pattern 'Claude Code is running' -Quiet)) {
              throw "UNINSTALL REFUSE unconfirmed: files present but no 'Claude Code is running' refuse message logged"
            }
            Write-Host "Bug 2 uninstall-refuse smoke PASSED (uninstaller refused via the guard; files survived)."
          }
          finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            Start-Process $uninst.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait | Out-Null
            $d2 = (Get-Date).AddSeconds(30)
            while ((Get-Process "unins*" -ErrorAction SilentlyContinue) -and (Get-Date) -lt $d2) { Start-Sleep -Milliseconds 250 }   # let cleanup finish
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghidrust-installer
          path: |
            ghidrust/dist/ghidrust-setup-*.exe
            ghidrust/dist/ghidrust-setup-*.exe.sha256
