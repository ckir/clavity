# Pre-commit hooks for the Python bridge (agy-mcp-bridge/).
#
# Self-contained via uv: ruff + lefthook are dev-deps in agy-mcp-bridge/pyproject.toml — no global
# installs are strictly required (a global `lefthook` makes the git-hook bootstrap simplest; otherwise
# activate through uv as below).
#
# Activate once per clone (writes .git/hooks):
#   uv run --project agy-mcp-bridge lefthook install
#   # or, if lefthook is on PATH globally:  lefthook install
#
# Fires ONLY when Python files are staged — pure-Rust commits are untouched. The Rust side keeps its
# own gate (cargo fmt/clippy, manual + CI); add a `cargo fmt --check` command here for unified hygiene.
#
# NOTE: lint and format run in ONE sequential command on purpose. They both rewrite the staged files,
# so running them in parallel races and clobbers each other's edits — `check --fix` first, then `format`.
pre-commit:
  commands:
    ruff:
      glob: "**/*.py"
      run: uv run --project agy-mcp-bridge ruff check --fix {staged_files} && uv run --project agy-mcp-bridge ruff format {staged_files}
      stage_fixed: true
