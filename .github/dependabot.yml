# Dependabot config for the clavity monorepo.
# Grouping rule (see wiring-rust-repo-automation skill): minor+patch are grouped into ONE PR per
# ecosystem; MAJOR updates are excluded from the group by construction, so they arrive as individual
# PRs. Since 2026-09-18 the auto-merge workflow (.github/workflows/dependabot-automerge.yml) merges
# EVERY update type, majors included — so a major still arrives as its own PR, but it no longer waits
# for a human: it merges as soon as the required checks pass. The grouping below therefore controls
# only how updates are BATCHED, never whether they need review.
version: 2
updates:
  # ---- Rust: clavity-classic workspace ----
  - package-ecosystem: cargo
    directory: /clavity-classic
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- .NET: clavity-dotnet (no .sln; projects live under src/** and tests/**) ----
  - package-ecosystem: nuget
    directories:
      - /clavity-dotnet/**
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- GitHub Actions used by .github/workflows/** ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
