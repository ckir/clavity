name: ci-installer-classic

# Continuous installer coverage for the classic member. build-classic.yml's smoke is already blocking,
# so no fail_on_smoke input is needed.
on:
  push:
    branches: [main]
    paths:
      - 'clavity-classic/**'
      - 'installer/_shared/**'
      - '.github/workflows/build-classic.yml'
      - '.github/workflows/ci-installer-classic.yml'
      - 'scripts/generate-scoped-manifest.ps1'
      - 'scripts/check-versions.ps1'
      # build-classic.yml runs check-seed-budget.ps1 and check-cheatsheet-budget.ps1, whose inputs are
      # these two files. build-classic.yml is workflow_call-only, so it fires ONLY via a caller like this
      # one - and no other workflow runs those budget checks. Without these entries, bloating the seed or
      # the cheatsheet past its cap merges green with the gate never having run.
      - 'seed/golden-header.md'
      - 'agy-autotrain/knowledge/driver-cheatsheet.core.md'
  pull_request:
    paths:
      - 'clavity-classic/**'
      - 'installer/_shared/**'
      - '.github/workflows/build-classic.yml'
      - '.github/workflows/ci-installer-classic.yml'
      - 'scripts/generate-scoped-manifest.ps1'
      - 'scripts/check-versions.ps1'
      # build-classic.yml runs check-seed-budget.ps1 and check-cheatsheet-budget.ps1, whose inputs are
      # these two files. build-classic.yml is workflow_call-only, so it fires ONLY via a caller like this
      # one - and no other workflow runs those budget checks. Without these entries, bloating the seed or
      # the cheatsheet past its cap merges green with the gate never having run.
      - 'seed/golden-header.md'
      - 'agy-autotrain/knowledge/driver-cheatsheet.core.md'

concurrency:
  group: ci-installer-classic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    uses: ./.github/workflows/build-classic.yml
