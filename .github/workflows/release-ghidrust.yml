name: release-ghidrust

# THE release entry point for the ghidrust tool. A ghidrust-v<N> tag builds the installer and publishes
# the tool's OWN GitHub Release (per-tool lineage, D2). Lives on MAIN (orchestration); reaches the tool's
# code + build block on its branch via uses: ...@ghidrust (D7).
on:
  push:
    tags:
      - 'ghidrust-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. ghidrust-v1) — REQUIRED on dispatch (a dispatch has no triggering tag).'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-ghidrust
  cancel-in-progress: false

jobs:
  resolve-ref:
    # Pin the tool-branch commit ONCE at cut time (D7 SHA-pin) so a re-run weeks later rebuilds the SAME
    # snapshot.
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
    steps:
      - id: r
        shell: bash
        run: |
          sha=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/ghidrust | cut -f1)
          if [ -z "$sha" ]; then echo "::error::could not resolve ghidrust SHA"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-ref
    # Cross-branch: the reusable build block FILE is loaded from the tool branch tip (D7). owner/repo is
    # HARDCODED — Actions forbids expressions in `uses:` (a fork calls this upstream, as build-classic does).
    # The CODE checkout is SHA-pinned separately via the `ref` input below (§6 @ref discipline).
    uses: ckir/clavity/.github/workflows/build-ghidrust.yml@ghidrust
    with:
      ref: ${{ needs.resolve-ref.outputs.sha }}

  e2e:
    # Live pre-publish gate (B): boot real Ghidra against the built binary and prove attach + read +
    # durable-write end-to-end before the release goes out. `needs: build` so a broken build never pays the
    # ~573 MB Ghidra download; also needs resolve-ref for the SHA-pinned source checkout (nextest compiles
    # its OWN test harnesses, so it needs SOURCE — the release .exe artifact cannot be reused here).
    needs: [resolve-ref, build]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tool source (SHA-pinned to the built commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Setup JDK 21 (Ghidra 12.1.2 runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache Ghidra 12.1.2
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: ghidra_dist
          key: ghidra-12.1.2-PUBLIC-20260605

      - name: Download + checksum-verify + extract Ghidra (cache miss only)
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'   # else IWR's progress render makes a 573 MB download crawl
          # URL + SHA-256 hardcoded from the official NSA release (supply-chain: verify BEFORE extract).
          $url = 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip'
          $sha = 'b62e81a0390618466c019c60d8c2f796ced2509c4c1aea4a37644a77272cf99d'
          $zip = Join-Path $env:RUNNER_TEMP 'ghidra.zip'
          # Single retry on the DOWNLOAD ONLY (network flake) — the assertions are never retried.
          $ok = $false
          foreach ($i in 1..2) {
            try { Invoke-WebRequest -Uri $url -OutFile $zip; $ok = $true; break }
            catch { Write-Host "download attempt $i failed: $_"; Start-Sleep -Seconds 10 }
          }
          if (-not $ok) { throw "Ghidra download failed after retries" }
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha) { throw "Ghidra SHA-256 mismatch: got $actual, expected $sha" }
          New-Item -ItemType Directory -Force -Path ghidra_dist | Out-Null
          Expand-Archive -Path $zip -DestinationPath ghidra_dist -Force
          Remove-Item $zip

      - name: Resolve GHIDRA_INSTALL_DIR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = (Get-ChildItem -Directory ghidra_dist -Filter 'ghidra_*_PUBLIC' | Select-Object -First 1).FullName
          if (-not $dir) { throw "extracted Ghidra dir not found under ghidra_dist" }
          "GHIDRA_INSTALL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "GHIDRA_INSTALL_DIR=$dir"

      - name: Build fixture + analyze headless
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          clang --version   # fixture needs clang's debug info so named types reach Ghidra (README §1); fail loud if absent
          $fixDir = Join-Path $env:RUNNER_TEMP 'ghidrust-fixture'
          New-Item -ItemType Directory -Force -Path $fixDir | Out-Null
          clang -g crates/ghidrust-mcp/tests/fixtures/fixture.c -o (Join-Path $fixDir 'fixture.exe')
          # $ErrorActionPreference='Stop' does NOT halt on a native command's nonzero exit — check explicitly.
          if ($LASTEXITCODE -ne 0) { throw "clang failed to compile fixture.c ($LASTEXITCODE)" }
          if (-not (Test-Path (Join-Path $fixDir 'fixture.exe'))) { throw "fixture.exe not built" }
          # analyzeHeadless.bat — the Windows launcher (the bare shell script is for *nix).
          & "$env:GHIDRA_INSTALL_DIR\support\analyzeHeadless.bat" $fixDir fixtureproj -import (Join-Path $fixDir 'fixture.exe') -overwrite
          if ($LASTEXITCODE -ne 0) { throw "analyzeHeadless failed ($LASTEXITCODE)" }
          "GHIDRUST_FIXTURE_PROJECT_DIR=$fixDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Live E2E smoke — attach + read + durable write
        timeout-minutes: 10
        shell: pwsh
        env:
          GHIDRUST_E2E: '1'
          GHIDRUST_FIXTURE_PROJECT_NAME: fixtureproj
          GHIDRUST_FIXTURE_PROGRAM: /fixture.exe
          GHIDRUST_FIXTURE_FUNCTION: compute
        run: |
          $ErrorActionPreference = 'Stop'
          # -E filter isolates EXACTLY the 2 smoke tests; without it, GHIDRUST_E2E=1 would run the whole
          # ~30-min gated suite. --test-threads=1: one Ghidra project = one server (project-lock).
          $filter = 'test(find_functions_lists_known_function) or test(comment_plate_persists_across_restart)'
          # Guard the gate against silent false-positives: a renamed/removed test would shrink the selection
          # and `nextest run` would still exit 0 ("0 tests run"). Assert BOTH named tests are actually
          # selected, then --no-tests=fail turns any zero-match run into an error instead of a green no-op.
          $listed = cargo nextest list -p ghidrust-mcp -E $filter 2>&1 | Out-String
          foreach ($t in 'find_functions_lists_known_function','comment_plate_persists_across_restart') {
            if ($listed -notmatch [regex]::Escape($t)) { throw "smoke test '$t' not selected by filter — test-name drift?" }
          }
          cargo nextest run -p ghidrust-mcp -E $filter --no-tests=fail --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "live E2E smoke failed ($LASTEXITCODE)" }

  publish:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      - name: Assemble release notes
        id: notes
        shell: bash
        env:
          # Pass the dispatch-supplied tag via env, NOT inline ${{…}} interpolation, so a crafted
          # workflow_dispatch input cannot inject shell (Actions script-injection hardening). ref_name on a
          # tag push is constrained by the tag ruleset, so it stays inline.
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cat > body.md <<EOF
          # ghidrust $TAG

          | tool | version | source |
          |------|---------|--------|
          | ghidrust | ${{ needs.build.outputs.version }} | ghidrust@${{ needs.build.outputs.sha }} |

          Installer is **unsigned** (Windows SmartScreen may warn: *More info -> Run anyway*).
          Verify the \`.sha256\` against the \`.exe\` before running.
          EOF

      - name: Publish the ghidrust release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body_path: body.md
          make_latest: false   # D2/§6: only the clavity flagship claims the "Latest" badge
          files: |
            dist/ghidrust-setup-*.exe
            dist/ghidrust-setup-*.exe.sha256
