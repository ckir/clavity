# TEMP (ROADMAP section 83): measures the parallel Pester runner against the serial sweep on windows-latest. NOT a gate; deleted before merge.
name: s83-measure

on:
  pull_request:
    paths: [".github/workflows/s83-measure.yml"]

jobs:
  measure:
    name: s83 measure (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v7

      - name: Deepen history for the ROADMAP claims gate
        # actions/checkout is SHALLOW by default (fetch-depth 1), and check B of
        # scripts/check-roadmap-claims.ps1 resolves every sha the ROADMAP cites beside a closure word.
        # MEASURED on a real `git clone --depth 1` of this repository: 43 PHANTOM lines and exit 1,
        # where the full clone exits 0 - the gate would have accused every closure entry in the document
        # of citing a sha that does not exist. The same reasoning, and the same fix, as the knowledge-
        # store gate above. The script ALSO detects a shallow repository and reports SHALLOW rather than
        # a wall of false phantoms, so if this step is ever removed the gate fails in one honest line
        # instead of silently passing OR lying.
        run: git fetch --unshallow --quiet || git fetch --quiet --depth=2147483647
        shell: bash

      - name: Install ripgrep
        shell: pwsh
        # scripts/check-plugin-namespace.ps1 hard-requires `rg` on PATH and Write-Errors without it, so
        # all 5 of its assertions went red in CI while passing locally - the dev box carries rg on PATH,
        # CI did not, and nothing installed it. Prepend the shim dir to GITHUB_PATH so LATER steps see it
        # too, then assert `rg` actually resolves: a silent install failure must fail HERE and by name,
        # not resurface later as five unrelated-looking assertion failures.
        run: |
          # RETRIED, because the failure mode is the PACKAGE FEED and not this repository. MEASURED
          # 2026-09-12: community.chocolatey.org answered 503 Service Unavailable for the ripgrep package,
          # choco installed 0/0 packages, and the whole scripts job went red on a commit that touched no
          # script. A transient dependency outage must cost a retry, not a red main.
          $ok = $false
          foreach ($attempt in 1..3) {
            choco install ripgrep -y --no-progress
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "::warning::ripgrep install attempt $attempt failed (choco exit $LASTEXITCODE); retrying"
            Start-Sleep -Seconds (10 * $attempt)
          }
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          # The ORACLE IS `rg` ON PATH, not choco's exit code: a cached-but-unlinked install would satisfy
          # the loop above and still leave the gate unable to run.
          rg --version
          if ($LASTEXITCODE -ne 0) { throw "ripgrep install failed after $(if ($ok) { 'a successful install' } else { '3 attempts' }): rg is not on PATH" }

      - name: Install lefthook
        shell: pwsh
        # check-curate-in-progress.Tests.ps1 proves the pre-commit WIRING behaviourally - it runs the real
        # lefthook binary against the real lefthook.yml, because a config parse cannot show the hook
        # actually fires. That row THROWS rather than skipping when lefthook is absent: a wiring proof
        # that skips itself certifies exactly what it stopped checking. So CI must supply the binary.
        # The npm package is the route this repo already uses on the dev box - note the SCOPE, there is
        # no bare `lefthook` package. Same assert-by-name discipline as the ripgrep step above: a silent
        # install failure must fail HERE, not resurface as an unrelated-looking assertion failure.
        #
        # PIN THE MAJOR LINE, for the same reason the Pester step pins the v6 line: an unpinned install
        # silently rolls forward, and a major bump can change `lefthook run`'s exit semantics or its
        # config schema - which is precisely what the behavioural row and the config-parse rows read.
        # The floor is the version the dev box runs, so CI and a developer cannot diverge across a
        # major. Bump this deliberately, after running the suite against the new line.
        run: |
          npm install -g '@evilmartians/lefthook@^2.1.10'
          # Prepend npm's global prefix to GITHUB_PATH so the LATER Pester step sees the binary, exactly
          # as the ripgrep step does for choco. On Windows npm places global shims directly in the
          # prefix directory, not in a bin/ subdirectory.
          $prefix = (npm prefix -g).Trim()
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$prefix;$env:PATH"
          lefthook version
          if ($LASTEXITCODE -ne 0) { throw "lefthook install failed: lefthook is not on PATH" }

      - name: Install yq (required by check-skill-frontmatter)
        shell: pwsh
        # scripts/check-skill-frontmatter.ps1 parses every SKILL.md frontmatter with mikefarah yq v4 and
        # exits 2 ("cannot answer") without it, so a runner lacking yq would turn the gate - and every row
        # of its Pester suite - red for an environmental reason. RETRIED for the same package-feed reason
        # as ripgrep, and the ORACLE is `yq --version` naming mikefarah v4, not choco's exit code.
        run: |
          if (-not ((Get-Command yq -ErrorAction SilentlyContinue) -and ((yq --version) -match 'mikefarah.*version v4\.'))) {
            foreach ($attempt in 1..3) {
              choco install yq -y --no-progress
              if ($LASTEXITCODE -eq 0) { break }
              Write-Host "::warning::yq install attempt $attempt failed (choco exit $LASTEXITCODE); retrying"
              Start-Sleep -Seconds (10 * $attempt)
            }
            "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          }
          $v = (yq --version) | Out-String
          if ($v -notmatch 'mikefarah.*version v4\.') { throw "yq install failed: need mikefarah yq v4 on PATH, got '$($v.Trim())'" }
          Write-Host $v

      - name: Install ast-grep (required by check-capstone-new-code)
        shell: pwsh
        # ADDED 2026-09-05 after this workflow went RED on its first exposure to
        # scripts/tests/check-capstone-new-code.Tests.ps1. 33 of 37 failing rows had ONE cause:
        # `check-capstone-new-code.ps1:255` refuses to run without ast-grep and exits 2 - "the question
        # cannot be answered" - so every row expecting 0 or 3 got 2. The GATE was correct; the WORKFLOW
        # was missing a dependency the dev box has on PATH and the runner does not.
        #
        # THE ROW THAT PINS THE MISSING-TOOL PATH PASSED, and that is the trap worth recording:
        # 'exits 2 when ast-grep is not on PATH' was GREEN in that same run - trivially, because the tool
        # really was absent. A suite can be 33-rows-red and still show a green row asserting the failure
        # mode, so "some rows passed" says nothing about whether the environment is right.
        #
        # PIN THE MAJOR LINE, for the same reason lefthook and Pester are pinned above: an unpinned
        # install rolls forward silently, and Rule B reads ast-grep's tree-sitter node KINDS - a grammar
        # bump can rename a kind and turn every declaration invisible, which is the fail-open direction.
        # The floor is the version the dev box runs (0.45.1, measured 2026-09-05).
        run: |
          npm install -g '@ast-grep/cli@^0.45.1'
          $prefix = (npm prefix -g).Trim()
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$prefix;$env:PATH"
          ast-grep --version
          if ($LASTEXITCODE -ne 0) { throw "ast-grep install failed: ast-grep is not on PATH" }

      - name: Put the real jq first on PATH (Branch 20 process budget)
        shell: pwsh
        run: |
          # Chocolatey's bin\jq.exe is a shim that starts lib\...\jq.exe as a CHILD, so every jq call costs one
          # extra process in scripts/tests/hook-spawn-budget.Tests.ps1. Prepend the real binary's directory.
          $real = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Recurse -Filter jq.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($real) { $real.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8; "real jq: $($real.FullName)" }
          else { '::warning title=hook budget::no Chocolatey jq under C:\ProgramData\chocolatey\lib - PATH unchanged; if a hook-spawn-budget row fails on CI only, a jq shim (one extra process per call) is the first suspect' }

      - name: Install Pester v6
        shell: pwsh
        # RETRIED like the yq step: the gallery lookup itself blips (NoMatchFoundForCriteria twice within an
        # hour on 2026-10-26 while a plain re-run passed). The ORACLE is a v6 module on disk, not the cmdlet's
        # exit; three failures still fail HERE rather than falling through to a preinstalled Pester.
        run: |
          $ok = $false
          foreach ($attempt in 1..3) {
            try {
              Install-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.99.99 -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop
              $ok = $true; break
            } catch {
              Write-Host "::warning::Pester v6 install attempt $attempt failed: $($_.Exception.Message); retrying"
              # DIAGNOSTIC (2026-10-26): the NuGet provider turns a failed gallery request into "no match" or
              # "failed to download" and logs the cause at debug level only. Ask the same two endpoints
              # directly - the find-by-id lookup, then the package download it would fetch - so the log
              # names the status and the host that finally served each.
              $probeGallery = {
                param($label, $uri, $n)
                try {
                  $r = Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 60
                  $bytes = if ($r.Content) { $r.Content.Length } else { 0 }
                  $base = $r.BaseResponse
                  $via = if ($base.ResponseUri) { $base.ResponseUri.Host } elseif ($base.RequestMessage) { $base.RequestMessage.RequestUri.Host } else { 'unknown host' }
                  Write-Host "::notice::gallery $label probe after attempt ${n}: HTTP $([int]$r.StatusCode), $bytes bytes, served by $via"
                  return $r
                } catch {
                  $resp = $_.Exception.Response
                  $code = if ($resp) { [int]$resp.StatusCode } else { 'no response' }
                  $hdr = if (-not $resp) { $_.Exception.Message }
                         elseif ($resp.Headers -is [System.Net.WebHeaderCollection]) { ($resp.Headers.AllKeys | ForEach-Object { "$_=$($resp.Headers[$_])" }) -join '; ' }
                         else { ($resp.Headers.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value -join ',')" }) -join '; ' }
                  Write-Host "::warning::gallery $label probe after attempt ${n}: HTTP $code; $($hdr.Substring(0, [Math]::Min(300, $hdr.Length)))"
                  return $null
                }
              }
              $found = & $probeGallery 'find' "https://www.powershellgallery.com/api/v2/FindPackagesById()?id='Pester'" $attempt
              $want = '6.2.0'
              if ($found -and $found.Content) {
                $v6 = [regex]::Matches([string]$found.Content, '<d:Version>(6\.\d+\.\d+)</d:Version>') | ForEach-Object { [version]$_.Groups[1].Value } | Sort-Object -Descending | Select-Object -First 1
                if ($v6) { $want = $v6.ToString() }
              }
              $null = & $probeGallery "download of Pester $want" "https://www.powershellgallery.com/api/v2/package/Pester/$want" $attempt
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          if (-not $ok) {
            # One verbose + debug install, so the provider's own "could not get response from query" line
            # (debug level) reaches the log. If it succeeds this time, the module check below still decides.
            Write-Host '::group::Install-Module verbose and debug diagnostics (all attempts failed)'
            $savedDebug = $DebugPreference; $savedVerbose = $VerbosePreference
            $DebugPreference = 'Continue'; $VerbosePreference = 'Continue'
            try {
              $diag = @(Install-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.99.99 -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop *>&1)
              $diag | Select-Object -First 80 | ForEach-Object { Write-Host "[diag] $_" }
            } catch {
              Write-Host "[diag] $($_.Exception.Message)"
            } finally {
              $DebugPreference = $savedDebug; $VerbosePreference = $savedVerbose
            }
            Write-Host '::endgroup::'
            if (Get-Module Pester -ListAvailable | Where-Object { $_.Version.Major -eq 6 }) { $ok = $true }
          }
          if (-not $ok) {
            # FALLBACK (PSGallery lookup down while its package API is up: 'No match was found ... module name
            # Pester' on every attempt, 2026-10-26): fetch the one pinned package directly, verify its SHA-256
            # (a mismatch fails closed), and unpack it where Install-Module -Scope CurrentUser would.
            $ver = '6.2.0'
            $sha = 'e6ac7418d4f12500269aaca58ae56cf1caafbbf1afa2cec334e289d1cf50a239'
            $tmp = Join-Path ([IO.Path]::GetTempPath()) "pester-$ver.zip"
            Invoke-WebRequest -Uri "https://www.powershellgallery.com/api/v2/package/Pester/$ver" -OutFile $tmp -UseBasicParsing
            $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $tmp).Hash.ToLowerInvariant()
            if ($got -ne $sha) { throw "Pester $ver package hash mismatch: got $got, want $sha" }
            $root = ($env:PSModulePath -split [IO.Path]::PathSeparator | Where-Object { $_ -and $_.StartsWith($HOME, [StringComparison]::OrdinalIgnoreCase) } | Select-Object -First 1)
            if (-not $root) { throw "no CurrentUser module path under $HOME in PSModulePath" }
            $dest = Join-Path (Join-Path $root 'Pester') $ver
            if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Expand-Archive -LiteralPath $tmp -DestinationPath $dest -Force
            Write-Host "::warning::Pester $ver installed from the pinned package (gallery lookup failed)"
          }
          $v = Get-Module Pester -ListAvailable | Where-Object { $_.Version.Major -eq 6 } | Select-Object -First 1
          if (-not $v) { throw "no Pester v6 module on disk after install" }
          "Pester $($v.Version) at $($v.ModuleBase)"

      - name: Machine
        shell: pwsh
        run: |
          "logical processors: $([Environment]::ProcessorCount)"
          Get-CimInstance Win32_Processor | ForEach-Object { "cpu: $($_.Name) cores=$($_.NumberOfCores) logical=$($_.NumberOfLogicalProcessors)" }
          "ram GB: $([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB,1))"
          "pwsh: $($PSVersionTable.PSVersion)"
          "image: $env:ImageOS $env:ImageVersion"

      # Every arm runs in THIS job, on THIS runner, one after the other, so the wall times are comparable. Each arm is its own
      # step with continue-on-error so one failing arm does not hide the others; the numbers go to the step summary.
      - name: Arm 1 - runner, throttle 4 (as the Linux job runs it)
        id: a1
        continue-on-error: true
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          pwsh -NoProfile -File scripts/run-pester-parallel.ps1 -Directory scripts/tests -SkipInventory scripts/tests/_skip-inventory.md -ShowMessages -MinTests 100 -RequireSuite test-suite-registration -ThrottleLimit 4
          $rc = $LASTEXITCODE
          "ARM1 runner throttle=4 exit=$rc wall=$([math]::Round($sw.Elapsed.TotalSeconds,1))s" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($rc -ne 0) { exit $rc }

      - name: Arm 2 - runner, throttle 2
        id: a2
        continue-on-error: true
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          pwsh -NoProfile -File scripts/run-pester-parallel.ps1 -Directory scripts/tests -SkipInventory scripts/tests/_skip-inventory.md -ShowMessages -MinTests 100 -RequireSuite test-suite-registration -ThrottleLimit 2
          $rc = $LASTEXITCODE
          "ARM2 runner throttle=2 exit=$rc wall=$([math]::Round($sw.Elapsed.TotalSeconds,1))s" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($rc -ne 0) { exit $rc }

      - name: Arm 3 - serial Invoke-Pester (the current gate, verbatim checks)
        id: a3
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.99.99 -Force
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $r = Invoke-Pester scripts/tests -Output Minimal -PassThru
          $wall = [math]::Round($sw.Elapsed.TotalSeconds,1)
          $bad = @($r.Containers | Where-Object { $_.Result -ne 'Passed' })
          $line = "ARM3 serial passed=$($r.PassedCount) failed=$($r.FailedCount) skipped=$($r.SkippedCount) total=$($r.TotalCount) containers=$(@($r.Containers).Count) badContainers=$($bad.Count) wall=${wall}s"
          $line | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($r.FailedCount -gt 0 -or $bad.Count -gt 0) { exit 1 }

      - name: Arm 4 - runner, throttle 4 again (warm repeat)
        id: a4
        continue-on-error: true
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          pwsh -NoProfile -File scripts/run-pester-parallel.ps1 -Directory scripts/tests -SkipInventory scripts/tests/_skip-inventory.md -ShowMessages -MinTests 100 -RequireSuite test-suite-registration -ThrottleLimit 4
          $rc = $LASTEXITCODE
          "ARM4 runner throttle=4 repeat exit=$rc wall=$([math]::Round($sw.Elapsed.TotalSeconds,1))s" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($rc -ne 0) { exit $rc }

      - name: Arm 5 - runner without hook-spawn-budget (throttle 4), then that suite serial
        id: a5
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.99.99 -Force
          $sw = [Diagnostics.Stopwatch]::StartNew()
          pwsh -NoProfile -File scripts/run-pester-parallel.ps1 -Directory scripts/tests -SkipInventory scripts/tests/_skip-inventory.md -ShowMessages -MinTests 100 -RequireSuite test-suite-registration -ThrottleLimit 4 -Exclude hook-spawn-budget
          $rc = $LASTEXITCODE
          $mid = [math]::Round($sw.Elapsed.TotalSeconds,1)
          $r = Invoke-Pester scripts/tests/hook-spawn-budget.Tests.ps1 -Output Minimal -PassThru
          "ARM5 runner-minus-hook exit=$rc runner_wall=${mid}s then hook-spawn-budget serial failed=$($r.FailedCount) passed=$($r.PassedCount) total_wall=$([math]::Round($sw.Elapsed.TotalSeconds,1))s" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($rc -ne 0 -or $r.FailedCount -gt 0) { exit 1 }

      - name: Verdict (fails if any arm failed, so a red run is visible)
        if: always()
        shell: pwsh
        run: |
          $o = @{ a1 = '${{ steps.a1.outcome }}'; a2 = '${{ steps.a2.outcome }}'; a3 = '${{ steps.a3.outcome }}'; a4 = '${{ steps.a4.outcome }}'; a5 = '${{ steps.a5.outcome }}' }
          $o.GetEnumerator() | Sort-Object Name | ForEach-Object { "$($_.Name): $($_.Value)" } | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($o.Values -contains 'failure') { exit 1 }
