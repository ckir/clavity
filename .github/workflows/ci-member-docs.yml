name: ci-member-docs

# The member-docs floor gate. Separate from ci-scripts.yml on purpose: that workflow fires on
# scripts/** and runs the whole Pester suite, but a missing member doc changes a MEMBER folder, so
# ci-scripts would never fire on the case this guards. This job runs one script and takes seconds.
# The gate script and the templates are in the path filter deliberately - without them, breaking the
# gate itself is a change no CI run exercises.
on:
  push:
    branches: [main]
    paths:
      - '*/README.md'
      - '*/CHANGELOG.md'
      - '*/plugin/README.md'
      - 'build/members.json'
      - 'scripts/check-member-docs.ps1'
      - 'clavity-dotnet/templates/tool-skeleton/**'
      - '.github/workflows/ci-member-docs.yml'
  pull_request:
    paths:
      - '*/README.md'
      - '*/CHANGELOG.md'
      - '*/plugin/README.md'
      - 'build/members.json'
      - 'scripts/check-member-docs.ps1'
      - 'clavity-dotnet/templates/tool-skeleton/**'
      - '.github/workflows/ci-member-docs.yml'

concurrency:
  group: ci-member-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  member-docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Member docs floor gate
        # pwsh 7: check-member-docs.ps1 is a maintainer-only dev script and only ever runs under
        # pwsh 7 (justfile, lefthook). It used to run under Windows PowerShell 5.1 "to catch PS7-only
        # syntax" - but that contract belongs to the end-user installer surface, not here. Gating a
        # dev script on 5.1 buys nothing and reports phantom failures; see ci-scripts.yml.
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-member-docs.ps1
