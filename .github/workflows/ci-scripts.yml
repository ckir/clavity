name: ci-scripts

# TWO CONTRACTS, TWO ENGINES - the split is by where the code actually RUNS, not by folder taste.
#
#   installer-5-1 - installer/_shared/register-plugin.ps1 runs on an END-USER Windows box, where only
#     Windows PowerShell 5.1 is guaranteed. It and its suite are gated under `shell: powershell`, plus
#     an ASCII gate: 5.1 reads a BOM-less .ps1 as ANSI/CP1252, so a stray em-dash mojibakes. Forbidding
#     non-ASCII beats relying on a BOM surviving every editor - and a BOM on register-plugin.ps1 would
#     break its SHA-256 hash pin (see check-register-hash-synced.ps1).
#
#   dev-scripts - scripts/** is maintainer-only and executes under pwsh 7. Gating it on 5.1 was a
#     mis-scoped contract: it failed 9 containers on PS7-only syntax (3-positional-arg Join-Path, whose
#     3rd arg is the PS7-only -AdditionalChildPath) while never exercising the end-user surface.
#
# register-plugin.Tests.ps1 runs in BOTH jobs on purpose: it must hold under either engine.
#
# NOTE: every `run:` block below is deliberately pure ASCII. Actions writes a run block to a BOM-less
# temp .ps1, so non-ASCII in a `shell: powershell` block would hit the very bug the ASCII gate exists
# to prevent.
#
# THERE IS NO `paths:` FILTER, AND ITS ABSENCE IS THE DESIGN. Read this before adding one back.
#
# A path filter decides WHETHER this workflow runs. That decision is the only way a suite can be
# bypassed: a file changes, the filter does not name it, and the suite that guards it never runs while
# the commit merges green. That defect class produced SEVEN known misses in this repository - six found
# by audit, and one found by AGY-CAPSTONE round 27, where FIVE suites asserted against
# `agy-autotrain/hooks/**` and no workflow in the repo triggered on it.
#
# Three mechanisms were tried against that class and all three failed for the same reason - each relied
# on a human remembering to record a dependency somewhere:
#   - a hand-maintained `$Required` roster: wrong at least six times;
#   - a static AST scanner over the suites: DELETED by owner decision after producing four defects of
#     its own against five real gaps, and it worked at top-level granularity so it would not have caught
#     round 27's defect anyway;
#   - Declarative Coverage Registration, where each suite declares its own trigger paths: specced and
#     torn down over three adversarial panel rounds, which established it would not have caught any of
#     the six historical misses either, because a forgotten declaration passes the gate silently.
#
# THE DECISION WAS REMOVED INSTEAD OF BEING AUTOMATED. A bypass needs a path to change AND CI to decline
# to run. With no filter there is no declining, so the class cannot occur - it is not detected, it is
# structurally impossible.
#
# MEASURED 2026-08-27, which is what makes this affordable and is the whole argument:
#   - this workflow's full run, all 49 suites, took 6m41s end to end (07:44:12Z -> 07:50:53Z);
#   - it fired 17 times in 30 days, NOT once per commit - GitHub triggers on PUSHES and this repository
#     batches heavily, so a 65-commit push is one run;
#   - the repository is PUBLIC, so Actions minutes cost nothing.
# The filter was therefore buying roughly five to fifteen skipped runs a month, of a seven-minute job,
# for free - against a roster, a gate, a checker and a proposed fifty-suite migration.
#
# WHEN TO REVISIT: if this workflow's runtime approaches the point where waiting on it changes how people
# work. At 6m41s it does not. Re-measure before assuming it still does not - and note that restoring a
# filter restores the defect class with it, so the trade is runtime against correctness, not against
# tidiness.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-5-1:
    name: installer contract (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 5.1 domain must be pure ASCII
        shell: pwsh
        # Same script `just check-installer-ascii` runs locally, so this cannot drift from the local
        # gate. Rationale for ASCII-over-BOM lives in the script header.
        run: pwsh -File scripts/check-installer-ascii.ps1

      - name: Hash-pin sync gate
        shell: pwsh
        run: pwsh -File scripts/check-register-hash-synced.ps1

      - name: Deepen history for the knowledge-store gate
        # actions/checkout is SHALLOW by default (fetch-depth 1), and the store gate's baseline is the
        # ref's HISTORY. MEASURED on a real `git clone --depth 1`: a committed deletion is invisible and
        # the gate reports every rule still present - a false statement. Without this the gate below is
        # decoration. The script ALSO refuses to run against a shallow repo, so if this step is ever
        # removed the gate fails loudly rather than silently passing.
        run: git fetch --unshallow --quiet || git fetch --quiet --depth=2147483647
        shell: bash

      - name: Knowledge store gate
        shell: pwsh
        # The store is the ONLY copy of the earned driver corpus outside one machine's runtime paths, so a
        # deletion here is unrecoverable in a way no other file in this repo is. The gate was unwired when
        # it shipped, which meant the only window it could fire in was a manual run between `rm` and
        # `git commit` - a window nothing creates. Its baseline is now the ref's HISTORY rather than a
        # tree, so this catches a deletion however long ago it was committed.
        run: pwsh -File scripts/check-knowledge-store.ps1

      - name: Dangling-consumer gate
        shell: pwsh
        # Fails when a binary reads a runtime filename nothing writes. This is invisible to every other
        # gate: it compiles, the tests pass because they write the file themselves, and the reader
        # degrades to its fallback in silence. MEASURED - it was red on this repo for the whole life of
        # the driver-cheatsheet EXTEND path, and nothing else noticed.
        run: pwsh -File scripts/check-dangling-consumers.ps1

      - name: Install Pester v6
        shell: powershell
        # Pin the v6 LINE. -MinimumVersion alone resolves to the newest version >= the floor, so an
        # unpinned install silently follows the newest major - which is how this pin came to exist in the
        # first place (it read v6.0.1 while the suites were validated on v5). Pin the major deliberately;
        # do not track latest. -ErrorAction Stop so a PSGallery blip fails HERE rather than falling
        # through to the Pester 3.4.0 that ships inside Windows PowerShell 5.1 - which is not a
        # hypothetical: a local probe for Assert-MockCalled resolved to that 3.4.0 copy, not to v6.
        run: Install-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.99.99 -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop

      - name: Pester - register-plugin (Windows PowerShell 5.1)
        shell: powershell
        # Import explicitly so the Pester 3.4.0 built into Windows 5.1 cannot shadow v6.
        run: |
          Import-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.99.99 -Force
          $r = Invoke-Pester scripts/tests/register-plugin.Tests.ps1 -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }
          # A container that fails DISCOVERY contributes 0 to FailedCount - that is how 9 broken files
          # still produced a plausible-looking count. Assert every container actually ran.
          $bad = @($r.Containers | Where-Object { $_.Result -ne 'Passed' })
          if ($bad.Count -gt 0) { throw "$($bad.Count) container(s) failed to run or discover" }
          if ($r.TotalCount -lt 15) { throw "only $($r.TotalCount) tests discovered - expected the register-plugin suite (>=15)" }

      - name: Pester - clavity-install (Windows PowerShell 5.1)
        shell: powershell
        # The installer runs on an END-USER Windows box where only 5.1 is guaranteed, so its suite must
        # hold under that engine - the same reasoning as register-plugin above (:15). Measured
        # 2026-08-14: Passed 12, Failed 0 under 5.1 (6.49s) and under pwsh 7 (4.77s).
        # A SEPARATE STEP, not folded into the register-plugin invocation above, whose TotalCount floor
        # is calibrated to that suite alone.
        run: |
          Import-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.99.99 -Force
          $r = Invoke-Pester clavity-dotnet/install/clavity-install.Tests.ps1 -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }
          $bad = @($r.Containers | Where-Object { $_.Result -ne 'Passed' })
          if ($bad.Count -gt 0) { throw "$($bad.Count) container(s) failed to run or discover" }
          if ($r.TotalCount -lt 12) { throw "only $($r.TotalCount) tests discovered - expected the clavity-install suite (>=12)" }

  dev-scripts:
    name: dev scripts (pwsh 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deepen history for the ROADMAP claims gate
        # actions/checkout is SHALLOW by default (fetch-depth 1), and check B of
        # scripts/check-roadmap-claims.ps1 resolves every sha the ROADMAP cites beside a closure word.
        # MEASURED on a real `git clone --depth 1` of this repository: 43 PHANTOM lines and exit 1,
        # where the full clone exits 0 - the gate would have accused every closure entry in the document
        # of citing a sha that does not exist. The same reasoning, and the same fix, as the knowledge-
        # store gate above. The script ALSO detects a shallow repository and reports SHALLOW rather than
        # a wall of false phantoms, so if this step is ever removed the gate fails in one honest line
        # instead of silently passing OR lying.
        run: git fetch --unshallow --quiet || git fetch --quiet --depth=2147483647
        shell: bash

      - name: Install ripgrep
        shell: pwsh
        # scripts/check-plugin-namespace.ps1 hard-requires `rg` on PATH and Write-Errors without it, so
        # all 5 of its assertions went red in CI while passing locally - the dev box carries rg on PATH,
        # CI did not, and nothing installed it. Prepend the shim dir to GITHUB_PATH so LATER steps see it
        # too, then assert `rg` actually resolves: a silent install failure must fail HERE and by name,
        # not resurface later as five unrelated-looking assertion failures.
        run: |
          choco install ripgrep -y --no-progress
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          rg --version
          if ($LASTEXITCODE -ne 0) { throw "ripgrep install failed: rg is not on PATH" }

      - name: Install lefthook
        shell: pwsh
        # check-curate-in-progress.Tests.ps1 proves the pre-commit WIRING behaviourally - it runs the real
        # lefthook binary against the real lefthook.yml, because a config parse cannot show the hook
        # actually fires. That row THROWS rather than skipping when lefthook is absent: a wiring proof
        # that skips itself certifies exactly what it stopped checking. So CI must supply the binary.
        # The npm package is the route this repo already uses on the dev box - note the SCOPE, there is
        # no bare `lefthook` package. Same assert-by-name discipline as the ripgrep step above: a silent
        # install failure must fail HERE, not resurface as an unrelated-looking assertion failure.
        #
        # PIN THE MAJOR LINE, for the same reason the Pester step pins the v6 line: an unpinned install
        # silently rolls forward, and a major bump can change `lefthook run`'s exit semantics or its
        # config schema - which is precisely what the behavioural row and the config-parse rows read.
        # The floor is the version the dev box runs, so CI and a developer cannot diverge across a
        # major. Bump this deliberately, after running the suite against the new line.
        run: |
          npm install -g '@evilmartians/lefthook@^2.1.10'
          # Prepend npm's global prefix to GITHUB_PATH so the LATER Pester step sees the binary, exactly
          # as the ripgrep step does for choco. On Windows npm places global shims directly in the
          # prefix directory, not in a bin/ subdirectory.
          $prefix = (npm prefix -g).Trim()
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$prefix;$env:PATH"
          lefthook version
          if ($LASTEXITCODE -ne 0) { throw "lefthook install failed: lefthook is not on PATH" }

      - name: Install Pester v6
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.99.99 -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop

      - name: Pester - full scripts suite (pwsh 7)
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.99.99 -Force
          $r = Invoke-Pester scripts/tests -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }
          $bad = @($r.Containers | Where-Object { $_.Result -ne 'Passed' })
          if ($bad.Count -gt 0) { throw "$($bad.Count) container(s) failed to run or discover" }
          if ($r.TotalCount -lt 100) { throw "only $($r.TotalCount) tests discovered - expected the full suite (>=100); a misnamed/misplaced *.Tests.ps1?" }
          # The registration oracle must itself have run. test-suite-registration.Tests.ps1 asserts an
          # EXACT equality between discovered containers and `git ls-files '*.Tests.ps1'`, which is what
          # proves every other suite was discovered - but that row only runs while this suite is itself
          # discovered. Without this check, losing THAT file degrades the whole gate to the count floor
          # above, which tolerates losing ~89% of the suite.
          $oracle = @($r.Containers | Where-Object { (Split-Path $_.Item -Leaf) -eq 'test-suite-registration.Tests.ps1' })
          if ($oracle.Count -ne 1) { throw "the registration oracle did not run (found $($oracle.Count) container(s) named test-suite-registration.Tests.ps1) - it is the check that proves every other suite was discovered, so this run cannot be trusted" }

      - name: Verify-gate fixture tests (bash)
        # A COMMITTED, WIRED HOOK WHOSE ONLY TEST NOTHING RAN. `.claude/hooks/agy-verify-reminder.sh` is
        # tracked, is wired in this repo's .claude/settings.json, and is the SessionStart gate that decides
        # when the verify harness nags. Its 15-case fixture suite is invoked by `just check-verify-hook`,
        # and NOTHING INVOKED THAT RECIPE: no hook, no CI job, no aggregate. Neither the hook nor its suite
        # was
        # reachable by any filter here either. Run locally before wiring: 15 passed, 0 failed - it was
        # never broken, just never run, which is the same shape as the installer guards round 14 found.
        #
        # THIS COMMENT SAID SOMETHING FALSE WHEN IT WAS WRITTEN, corrected 2026-08-27. It claimed the
        # recipe name "appears exactly ONCE in the whole repository: its own definition". Measured at the
        # parent commit: SIX occurrences across THREE files - the justfile definition plus two plan
        # documents, one naming it twice as a literal `Run: just check-verify-hook`. The true claim is the
        # one now above: nothing INVOKED it. A mention is not a caller, and stating the stronger,
        # checkable-and-false version of a true claim is how a rationale stops being evidence.
        shell: bash
        run: bash agy-autotrain/verify/testdata/run-hook-tests.sh

      - name: Pester - clavity-install (pwsh 7)
        shell: pwsh
        # NOT covered by the directory sweep above: that runs `Invoke-Pester scripts/tests` and this
        # suite lives in clavity-dotnet/install/. Assuming the sweep reaches it produces a green job
        # that ran nothing.
        run: |
          Import-Module Pester -MinimumVersion 6.0.0 -MaximumVersion 6.99.99 -Force
          $r = Invoke-Pester clavity-dotnet/install/clavity-install.Tests.ps1 -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }
          $bad = @($r.Containers | Where-Object { $_.Result -ne 'Passed' })
          if ($bad.Count -gt 0) { throw "$($bad.Count) container(s) failed to run or discover" }
          if ($r.TotalCount -lt 12) { throw "only $($r.TotalCount) tests discovered - expected the clavity-install suite (>=12)" }
