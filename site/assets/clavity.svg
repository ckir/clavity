    </filter>
    <filter id="glowBlue" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <clipPath id="leftWindow"><path d="M53 187 L503 254 Q531 258 531 284 L531 570 Q531 597 505 600 L57 632 Q25 635 25 603 L25 220 Q25 181 53 187Z"/></clipPath>
