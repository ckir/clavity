name: "🐛 Bug Report"
description: File a reproducible bug or defect in Clavity
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Before submitting, please verify that your Antigravity and Claude Code instances are authenticated.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which Clavity component is misbehaving?
      options:
        - "clavity-dotnet (Language Server MCP bridge)"
        - "clavity-classic (Rust / psmux bridge)"
        - "agy-autotrain"
        - "commonmemory"
        - "review-relay"
        - "Documentation / Website"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - "Linux (Ubuntu / Debian / other)"
        - "macOS (Apple Silicon - arm64)"
        - "macOS (Intel - x64)"
        - "Windows 11 / 10 x64"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment Versions
      description: Claude Code version, Antigravity (`agy`) version, .NET version
      placeholder: "e.g. Claude Code 0.2.x, Antigravity 2.x, dotnet 10.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What Happened
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Exact steps or prompts to reproduce the issue.
      placeholder: |
        1. In Claude Code, run `/brainstorm ...`
        2. Wait for `adversarial-panel-review` to trigger
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Session Logs / Diagnostic Output
      description: Relevant terminal excerpt or stderr output. (Never include private credentials or source code).
