name: ci-dotnet
on:
  push:
    branches: [main]
    paths:
      - 'clavity-dotnet/**'
      - '.github/workflows/ci-dotnet.yml'
      - '.github/workflows/build-dotnet.yml'
  pull_request:
    paths:
      - 'clavity-dotnet/**'
      - '.github/workflows/ci-dotnet.yml'
      - '.github/workflows/build-dotnet.yml'
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: clavity-dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build
      - name: Install just
        shell: pwsh
        # `just test` below is the ONE definition of "the dotnet tests" (clavity-dotnet/justfile): CI no longer lists the test projects
        # itself, so the local recipe and CI cannot drift apart (ROADMAP section 36, shape 2 - the local recipe ran one project while this
        # file ran two). `just` is not preinstalled on windows-latest. Same shape as the yq step in ci-scripts.yml: RETRIED for the
        # package-feed reason, and the ORACLE is `just --version`, not choco's exit code.
        run: |
          if (-not (Get-Command just -ErrorAction SilentlyContinue)) {
            foreach ($attempt in 1..3) {
              choco install just -y --no-progress
              if ($LASTEXITCODE -eq 0) { break }
              Write-Host "::warning::just install attempt $attempt failed (choco exit $LASTEXITCODE); retrying"
              Start-Sleep -Seconds (10 * $attempt)
            }
            "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          }
          $v = (just --version) | Out-String
          if ($v -notmatch '^just\s+\d') { throw "just install failed: got '$($v.Trim())'" }
          Write-Host $v
      # Runs BOTH test projects, Clavity.Ls.Tests and Clavity.Integration.Tests. The integration suite was never CI-run until 2026-08-20
      # (measured: this file held the ONLY `dotnet test` line across all 21 workflows), which left every 13b surfacing guard - TRUNCATED,
      # ECHO MISSING, ECHO WEAK, NO ECHO, UNCHECKED, the stale-verdict control and the schema pin - with no oracle at all. It runs against
      # fake in-process gRPC servers on loopback, no external dependency, ~20s.
      - run: just test
