name: release-clavity

# The clavity PRODUCT release (one of several tools in this umbrella repo — NOT the only release). A
# serial clavity-v<N> tag bundles clavity's two mutually-exclusive variants' installers into one GitHub
# Release named "clavity". Other tools release independently via their own release-<tool>.yml (see
# docs/hosting-a-tool.md). The file keeps its umbrella-release.yml name to avoid doc-drift (it is
# referenced by name in CONTRIBUTING.md and build-dotnet.yml).
on:
  push:
    tags:
      - 'clavity-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Serial umbrella tag for the release (e.g. clavity-v2) — REQUIRED on dispatch; a dispatch has no triggering tag.'
        required: true
        type: string

permissions:
  contents: write   # publish job creates the Release + uploads assets

concurrency:
  # A publish pipeline creates a release object then uploads 4 assets sequentially (not atomic). Never cancel a
  # run mid-upload (would leave a PARTIAL public release) — queue instead.
  group: release-clavity
  cancel-in-progress: false

jobs:
  guard:
    # F15: a clavity-v* tag fires this workflow regardless of branch. Verify the tagged commit is
    # reachable from origin/main BEFORE the heavy gate, so a stray/numeric tag on a dev branch cannot
    # publish. fetch-depth: 0 is REQUIRED — the default shallow checkout has no origin/main to compare.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag is on main
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          SHA="$(git rev-list -n1 "$TAG")"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::tag $TAG ($SHA) is not reachable from origin/main — refusing to release."
            exit 1
          fi
          echo "tag $TAG is on main ($SHA)"
      - name: CC2 roster drift gate
        # True CI enforcement of the release roster <-> build/members.json set-equality (option C,
        # owner-ratified 2026-07-12). pwsh is preinstalled on ubuntu-latest runners. A drifted roster
        # (a member in one but not the other) fails HERE, before any 573MB build or publish.
        shell: bash
        run: pwsh -File scripts/check-roster.ps1

      - name: Require ci-scripts GREEN for the tagged commit
        # WHY: ci-scripts was RED for two consecutive releases (clavity-v14 and v15) and both published
        # anyway. Nothing was wired to stop them: the tag push starts THIS workflow independently of the
        # branch push's checks, and release.ps1's local pre-flight passes on a dev box that has rg on
        # PATH while CI had none. A green local gate is not evidence about CI.
        #
        # Three outcomes, all explicit:
        #   run exists + not success  -> FAIL (do not publish behind a red script gate)
        #   run exists + success      -> pass
        #   no run after the grace    -> pass, because ci-scripts is path-filtered and a release that
        #                                touches none of its paths legitimately produces no run.
        # The GRACE period matters: the branch push and the tag push land seconds apart, so polling
        # immediately can see zero runs simply because none has been CREATED yet. Concluding "no run
        # needed" from that would reopen the exact hole this step closes.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          SHA="$(git rev-list -n1 "$TAG")"
          GRACE=240        # seconds to allow the run to be created before believing there is none
          TIMEOUT=2700     # seconds to allow it to finish
          API="repos/${{ github.repository }}/actions/workflows/ci-scripts.yml/runs?head_sha=$SHA"
          while :; do
            runs="$(gh api "$API" --jq '[.workflow_runs[] | {status, conclusion}]')"
            total="$(printf '%s' "$runs" | jq 'length')"
            if [ "$total" -eq 0 ]; then
              if [ "$SECONDS" -lt "$GRACE" ]; then sleep 15; continue; fi
              echo "no ci-scripts run for $SHA after ${GRACE}s - its paths were untouched, nothing to gate."
              exit 0
            fi
            pending="$(printf '%s' "$runs" | jq '[.[] | select(.status != "completed")] | length')"
            # An explicit `if`, NOT `[ ... ] && break`: under `set -e` that AND-list returns non-zero
            # whenever pending != 0, which would abort the step - failing the release gate merely for
            # having something left to wait for.
            if [ "$pending" -eq 0 ]; then break; fi
            if [ "$SECONDS" -ge "$TIMEOUT" ]; then
              echo "::error::ci-scripts still running for $SHA after ${TIMEOUT}s - refusing to publish on an unknown gate."
              exit 1
            fi
            echo "waiting for $pending ci-scripts run(s) on $SHA to complete..."
            sleep 20
          done
          bad="$(printf '%s' "$runs" | jq '[.[] | select(.conclusion != "success")] | length')"
          if [ "$bad" -ne 0 ]; then
            echo "::error::ci-scripts is RED for $SHA - refusing to publish. $runs"
            exit 1
          fi
          echo "ci-scripts is green for $SHA"

  dotnet:
    needs: [guard]
    uses: ./.github/workflows/build-dotnet.yml   # FILE ref = this tag's main commit (dotnet is already pinned by the tag)

  classic:
    needs: [guard]
    uses: ./.github/workflows/build-classic.yml

  ghidrust:
    needs: [guard]
    uses: ./.github/workflows/build-ghidrust.yml

  e2e-ghidrust:
    # BLOCKING live-E2E gate — the flagship vouches for the ghidrust it ships (shared reusable workflow, one
    # definition with release-ghidrust.yml). `needs: ghidrust` so a broken build skips the ~573 MB Ghidra
    # download; all tools now build from the same main checkout, so no ref pass-through is needed.
    needs: [ghidrust]
    uses: ./.github/workflows/e2e-ghidrust.yml

  agy-autotrain:
    needs: [guard]
    uses: ./.github/workflows/build-agy-autotrain.yml

  commonmemory:
    needs: [guard]
    uses: ./.github/workflows/build-commonmemory.yml

  publish:
    # Atomic all-or-nothing: a broken/failed-E2E ghidrust blocks the whole clavity release (no continue-on-error).
    needs: [dotnet, classic, ghidrust, e2e-ghidrust, agy-autotrain, commonmemory]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for release-notes extraction)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dotnet installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.dotnet.outputs.artifact-name }}
          path: dist-dotnet

      - name: Download classic installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.classic.outputs.artifact-name }}
          path: dist-classic

      - name: Download ghidrust installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ghidrust.outputs.artifact-name }}
          path: dist-ghidrust

      - name: Download agy-autotrain installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.agy-autotrain.outputs.artifact-name }}
          path: dist-agy-autotrain

      - name: Download commonmemory installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.commonmemory.outputs.artifact-name }}
          path: dist-commonmemory

      - name: Assemble release assets + notes
        id: notes
        shell: bash
        run: |
          # Effective umbrella tag: the triggering tag on push; the required `tag` input on dispatch (a dispatch
          # has no triggering tag, so github.ref_name would wrongly be 'main').
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp dist-dotnet/* out/
          cp dist-classic/* out/
          cp dist-ghidrust/* out/
          cp dist-agy-autotrain/* out/
          cp dist-commonmemory/* out/
          echo "assets in release:"; ls -1 out
          cat > body.md <<EOF
          # clavity $TAG

          Five standalone installers. Each does exactly ONE member and references no other —
          grab whichever you want from this one page.

          | installer | version | what it gives you | when you'd want it |
          |-----------|---------|--------------------|--------------------|
          | clavity-dotnet-setup      | ${{ needs.dotnet.outputs.version }}        | Claude Code <-> agy pairing (Primary, .NET host)  | Default choice for pairing Claude with agy |
          | clavity-classic-setup     | ${{ needs.classic.outputs.version }}       | Claude Code <-> agy pairing (Failover, Rust host) | Prefer the original Rust host, or dotnet is unavailable |
          | ghidrust-setup            | ${{ needs.ghidrust.outputs.version }}      | Headless Ghidra reverse-engineering over MCP      | You reverse-engineer binaries and want AI-assisted decompile/rename |
          | agy-autotrain-setup       | ${{ needs.agy-autotrain.outputs.version }} | agy auto-training loop (capture -> curate -> golden-header) | You already run a clavity driver and want it to keep learning your project |
          | commonmemory-setup        | ${{ needs.commonmemory.outputs.version }}  | Shared Claude<->agy notebook over agentmemory     | You run the agentmemory MCP server and want cross-agent shared facts |

          **clavity-dotnet** and **clavity-classic** are **mutually exclusive** — install ONE, not both.
          The other three install alongside either (or standalone). Installers are **unsigned** (Windows
          SmartScreen may warn on first run: *More info -> Run anyway*). Verify each \`.sha256\` against its \`.exe\`.
          There is **no** remote marketplace channel — every plugin ships locally inside its own installer.
          EOF
          echo "wrote body.md"
          # CC1/TO2: the chore(release) commit body carries the aggregated notes. Extract to a FILE
          # (never inline shell — the text is contributor-derived) and prepend to the catalog body.
          git log -1 --format=%b "$TAG" > release-notes.md || true
          if [ -s release-notes.md ]; then
            { echo "## What changed"; echo; cat release-notes.md; echo; cat body.md; } > body.combined.md
            mv body.combined.md body.md
          fi
          echo "final body.md assembled"

      - name: Publish ONE clavity release (all installers)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}   # explicit: correct on BOTH tag-push and dispatch (no ref tag)
          name: ${{ steps.notes.outputs.tag }}        # e.g. "clavity-v1" — the umbrella IS the clavity release (avoid doubling "clavity")
          body_path: body.md
          files: |
            out/clavity-dotnet-setup-*.exe
            out/clavity-dotnet-setup-*.exe.sha256
            out/clavity-classic-setup-*.exe
            out/clavity-classic-setup-*.exe.sha256
            out/ghidrust-setup-*.exe
            out/ghidrust-setup-*.exe.sha256
            out/agy-autotrain-setup-*.exe
            out/agy-autotrain-setup-*.exe.sha256
            out/commonmemory-setup-*.exe
            out/commonmemory-setup-*.exe.sha256
