name: build-dotnet

# Reusable build half of the dotnet release. The Inno Setup installer was RETIRED (2026-09-14): clavity-dotnet
# now installs via `claude plugin` + a fetch-on-first-run hook (clavity-dotnet/plugin/hooks/fetch-clavity-ls.sh)
# that downloads the self-contained clavity-ls binary from the release. This workflow therefore publishes that
# binary for every supported RID as a standalone `clavity-ls-<rid>-<version>.tar.gz` (+ .sha256) release asset.
# clavity-classic KEEPS its Inno installer; this change does not touch it.
#
# Called by umbrella-release.yml and runnable in isolation via workflow_dispatch. umbrella-release downloads
# every `dotnet-bin-*` artifact and attaches the tarballs to the GitHub release the fetch hook reads.
on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.validate.outputs.version }}
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clavity-dotnet
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from plugin.json
        id: ver
        shell: bash
        run: |
          # Source of truth is now the plugin manifest (the .iss AppVersion, formerly canonical, is retired).
          v=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' plugin/plugin.json | head -1)
          [ -n "$v" ] || { echo "no top-level version in plugin/plugin.json" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Version consistency
        shell: pwsh
        run: pwsh -File ../scripts/check-versions.ps1 dotnet && pwsh -File ../scripts/check-versions.ps1 dotnet -Coverage

      - name: SEED byte-budget gate
        run: pwsh -File ../scripts/check-seed-budget.ps1

      - name: Driver-cheatsheet byte-budget gate
        run: pwsh -File ../scripts/check-cheatsheet-budget.ps1

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest }   # arm64 runner
          - { rid: osx-x64,   os: macos-latest }   # arm64 runner; x64 binary smoke runs under Rosetta 2 (macos-13 Intel runner retired)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clavity-dotnet
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish + smoke + package (${{ matrix.rid }})
        shell: bash
        run: |
          set -e
          dotnet publish src/Clavity.Cli -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=false -o publish
          # win-x64 publishes clavity-ls.exe; every other RID publishes clavity-ls.
          bin=clavity-ls; [ -f publish/clavity-ls.exe ] && bin=clavity-ls.exe
          test -f "publish/$bin" || { echo "publish/$bin was not produced for ${{ matrix.rid }}" >&2; exit 1; }
          chmod +x "publish/$bin" 2>/dev/null || true
          # --help smoke on the NATIVE binary, on its own OS runner (usage + exit 0). Capture combined
          # streams so the check stays robust if usage moves to stderr.
          out=$("publish/$bin" --help 2>&1) || { echo "clavity-ls --help exited $?" >&2; exit 1; }
          [ -n "$out" ] || { echo "clavity-ls --help produced no output" >&2; exit 1; }
          echo "smoke OK (${{ matrix.rid }}): ${out:0:90}"
          # Normalise the in-archive name to clavity-ls; the fetch hook extracts `clavity-ls` and places it
          # at ${CLAUDE_PLUGIN_DATA}/bin/clavity-ls.exe (the .exe suffix is required only on Windows).
          [ "$bin" = clavity-ls ] || mv "publish/$bin" publish/clavity-ls
          mkdir -p dist
          v="${{ needs.validate.outputs.version }}"
          pkg="clavity-ls-${{ matrix.rid }}-$v.tar.gz"
          tar -C publish -czf "dist/$pkg" clavity-ls
          ( cd dist && sha256sum "$pkg" > "$pkg.sha256" )
          ls -la dist

      - name: Upload ${{ matrix.rid }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-bin-${{ matrix.rid }}   # umbrella-release downloads dotnet-bin-* — do NOT change the prefix
          path: |
            clavity-dotnet/dist/clavity-ls-${{ matrix.rid }}-*.tar.gz
            clavity-dotnet/dist/clavity-ls-${{ matrix.rid }}-*.tar.gz.sha256
