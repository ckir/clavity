name: build-classic

# Reusable build+smoke half of the classic release, minus the publish step. Called by umbrella-release.yml
# and runnable in isolation via workflow_dispatch. Monorepo consolidation: code now lives under
# clavity-classic/ on main; the checkout is naked (no branch/SHA pin) and the job runs from that folder.
on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      sha:
        value: ${{ jobs.build.outputs.sha }}
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022   # STATIC image (not -latest): keep MSVC/SDK stable so a historic build stays reproducible.
    defaults:
      run:
        working-directory: clavity-classic
    outputs:
      version: ${{ steps.ver.outputs.version }}
      sha: ${{ steps.head.outputs.sha }}
      artifact-name: classic-installer
    steps:
      - uses: actions/checkout@v7

      - name: Record built commit
        id: head
        shell: bash
        # Assign first, then echo: the `echo "sha=$(...)"` form discards git's exit code and can publish
        # a non-sha while the step stays green. Measured; full note in build-agy-autotrain.yml.
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Emit version output (from .iss)
        id: ver
        shell: pwsh
        run: |
          $iss = (Select-String -Path installer/clavity-classic.iss -Pattern '#define AppVersion "([^"]+)"').Matches[0].Groups[1].Value
          "version=$iss" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "CLAVITY_VER=$iss" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install uv (for uv.lock gate)
        uses: astral-sh/setup-uv@v10.0.1

      - uses: dtolnay/rust-toolchain@stable   # rust-toolchain.toml pins the actual channel; this provides the harness.

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clavity-classic

      - name: Version consistency (all 7 sources)   # after rust-toolchain so cargo metadata parses with the pinned channel, not the runner's preinstalled cargo
        shell: pwsh
        run: pwsh -File ../scripts/check-versions.ps1 classic && pwsh -File ../scripts/check-versions.ps1 classic -Coverage

      - name: SEED byte-budget gate
        run: pwsh -File ../scripts/check-seed-budget.ps1

      - name: Driver-cheatsheet byte-budget gate
        run: pwsh -File ../scripts/check-cheatsheet-budget.ps1

      - name: Build + stage (the 7.8 recipe)
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/build-classic-release.ps1
          if (-not (Test-Path publish/clavity.exe)) { throw "publish/clavity.exe not produced" }
          if (Test-Path publish/agy-mcp-bridge/.env) { throw "SECURITY: .env staged" }

      - name: Test gate
        run: cargo test --all --features test-fakes

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --no-progress -y; $iscc = Get-ChildItem "C:\Program Files*\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $iscc) { throw "ISCC.exe not found (no preinstall, install failed)" }
          "iscc=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate scoped marketplace.json (O3, single member)
        shell: pwsh
        run: ../scripts/generate-scoped-manifest.ps1 -MemberName clavity-classic -OutFile installer/marketplace.install.json

      - name: Build installer (ISCC)
        shell: pwsh
        run: |
          & "${{ steps.inno.outputs.iscc }}" installer/clavity-classic.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $setup = "dist/clavity-classic-setup-$env:CLAVITY_VER.exe"
          if (-not (Test-Path $setup)) { throw "$setup not produced" }

      - name: SHA-256 companion
        shell: pwsh
        run: |
          $name = "clavity-classic-setup-$env:CLAVITY_VER.exe"
          $h = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          # LF, two spaces, no BOM (GNU sha256sum -c compatible); matches the original release workflow exactly.
          [IO.File]::WriteAllText("$PWD/dist/$name.sha256", "$h  $name`n")

      - name: Smoke — install/uninstall lifecycle (BLOCKING)
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "dist/clavity-classic-setup-$env:CLAVITY_VER.exe"; $app = "$env:LOCALAPPDATA\Programs\clavity-classic"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=addtopath,install_bridge" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install exit $($p.ExitCode)" }
          # Finding-5: re-run the SAME installer over the fresh install — idempotent upgrade must exit 0.
          $p2 = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=addtopath,install_bridge" -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "re-run install exit $($p2.ExitCode) — idempotent upgrade must not abort" }
          if (-not (Test-Path "$app\.claude-plugin\marketplace.json")) { throw "scoped manifest missing after re-run install" }
          if (-not (Test-Path "$app\clavity.exe")) { throw "clavity.exe missing" }
          if (-not (Test-Path "$app\agy-mcp-bridge\SKILL.md")) { throw "bridge SKILL.md missing" }
          if (-not (Test-Path "$env:USERPROFILE\.clavity\golden-header.seed.md")) { throw "golden-header.seed.md not seeded" }
          $seeded = Get-Content -Raw "$env:USERPROFILE\.clavity\golden-header.seed.md"
          $bundled = Get-Content -Raw "$app\seed\golden-header.md"
          if ($seeded -ne $bundled) { throw "seeded golden-header.seed.md != bundled baseline" }
          if (-not (Test-Path "$app\.claude-plugin\marketplace.json")) { throw "marketplace.json not installed" }
          $manifest = Get-Content "$app\.claude-plugin\marketplace.json" -Raw | ConvertFrom-Json
          if ($manifest.name -ne 'clavity-classic') { throw "expected marketplace name clavity-classic (C9), got $($manifest.name)" }
          if ($manifest.plugins.Count -ne 1) { throw "expected 1 plugin in scoped manifest, got $($manifest.plugins.Count)" }
          if ($manifest.plugins[0].source -ne './plugins/clavity') { throw "unexpected plugin source $($manifest.plugins[0].source)" }
          if ($manifest.plugins[0].name -ne 'clavity') { throw "expected plugin identity clavity, got $($manifest.plugins[0].name)" }
          if (-not (Test-Path "$app\plugins\clavity")) { throw "plugins\clavity not staged" }

          # T5 - installed-tree manifest parity. A source-side check is a tautology for this defect
          # class: the packager dropping .claude-plugin\plugin.json leaves the source correct and only
          # the INSTALLED tree wrong. Hash equality, not a version comparison, is the instrument - a
          # version compare passes when a dropped file leaves a stale manifest whose version did not
          # move this release, and it would false-RED ghidrust, whose plugin.json and .iss AppVersion
          # are deliberately independent equality classes (scripts/check-versions.ps1).
          #
          # NOTE: this gate does NOT structurally validate the source manifest; it relies on the
          # "Version consistency" step above having ConvertFrom-Json'd it and required a .version key.
          $srcManifest  = "plugin/.claude-plugin/plugin.json"
          $instManifest = "$app\plugins\clavity\.claude-plugin\plugin.json"
          if (-not (Test-Path $srcManifest -PathType Leaf))  { throw "T5: source manifest missing, or not a file, at $srcManifest - no expected value to compare against" }
          if (-not (Test-Path $instManifest -PathType Leaf)) { throw "T5 MANIFEST PARITY: $instManifest was not installed as a file (packager dropped .claude-plugin\plugin.json, or shipped a directory of that name)" }
          $srcHash  = (Get-FileHash $srcManifest  -Algorithm SHA256).Hash
          # Retry the INSTALLED file only: a real-time scanner can hold a transient read-lock on a file
          # the installer extracted moments ago. The source file is a plain checkout artifact and is not
          # subject to that, so it is hashed once above.
          $instHash = $null
          foreach ($attempt in 1..5) {
            try { $instHash = (Get-FileHash $instManifest -Algorithm SHA256).Hash; break }
            catch {
              if ($attempt -eq 5) { throw "T5 MANIFEST PARITY: could not read $instManifest after 5 attempts - $($_.Exception.Message)" }
              Start-Sleep -Milliseconds 400
            }
          }
          if ($srcHash -ne $instHash) { throw "T5 MANIFEST PARITY: installed manifest bytes differ from source (installed=$instHash source=$srcHash) - stale or rewritten plugin.json" }
          Write-Host "[T5] installed manifest parity OK ($instHash)"

          # C6: pre-seed a fake growth.md and confirm a keep-data uninstall does NOT touch it.
          Set-Content "$env:USERPROFILE\.clavity\golden-header.growth.md" "fake learned wisdom"
          $arpKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{B59E963B-BE49-47B2-8CAB-5A3417D775C3}_is1"
          if (-not (Test-Path $arpKey)) { throw "ARP key missing (exact AppId _is1)" }
          $uninst = Get-ChildItem $app -Filter "unins*.exe" | Select-Object -First 1
          Start-Process $uninst.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait | Out-Null
          if (-not (Test-Path "$env:USERPROFILE\.clavity\golden-header.growth.md")) { throw "C6 VIOLATION: growth.md deleted by a keep-data driver uninstall" }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path "$app\clavity.exe") -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path "$app\clavity.exe") { throw "uninstall did not complete within 30s" }
          "lifecycle smoke PASSED"

      - name: Smoke — mutual-exclusion refusal (BLOCKING)
        timeout-minutes: 4
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = "$env:LOCALAPPDATA\Programs\clavity-classic"
          $fake = "$env:TEMP\fakels"; New-Item $fake -ItemType Directory -Force | Out-Null
          Set-Content "$fake\clavity-ls.exe" "x"; $env:PATH = "$fake;$env:PATH"
          $p = Start-Process "dist/clavity-classic-setup-$env:CLAVITY_VER.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -eq 0 -and (Test-Path "$app\clavity.exe")) { throw "refusal FAILED" }
          "mutual-exclusion smoke PASSED"

      - name: Smoke — .env exclusion (BLOCKING — secret-boundary guard)
        timeout-minutes: 4
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = "$env:LOCALAPPDATA\Programs\clavity-classic"
          $p = Start-Process "dist/clavity-classic-setup-$env:CLAVITY_VER.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=addtopath,install_bridge" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install exit $($p.ExitCode)" }
          if (Test-Path "$app\agy-mcp-bridge\.env") { throw "SECURITY: .env shipped in installed tree" }
          $uninst = Get-ChildItem $app -Filter "unins*.exe" | Select-Object -First 1
          Start-Process $uninst.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait | Out-Null
          ".env-exclusion smoke PASSED"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: classic-installer
          path: |
            clavity-classic/dist/clavity-classic-setup-*.exe
            clavity-classic/dist/clavity-classic-setup-*.exe.sha256
