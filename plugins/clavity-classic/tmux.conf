# clavity-classic: make Esc responsive in psmux.
# psmux/tmux defaults escape-time to 500ms, which holds every bare Esc for half a
# second to disambiguate it from an escape sequence (arrow/function keys). Inside a
# psmux session that makes Esc feel dropped/laggy — you can't Esc out of agy's
# popups/states — which is the bulk of the clavity "keyboard lock". 10ms is
# responsive while still leaving a tiny window so genuine multi-byte sequences
# aren't split.
#
# Add these lines to your ~/.tmux.conf, then start a FRESH psmux server so they
# load (escape-time is read at session creation): `tmux kill-server` once, or
# `clavity stop` before your next `clavity start`. Verify: `tmux show-options -s escape-time`.
set -g escape-time 10
set -s escape-time 10
