name: dependabot-automerge

# Enable GitHub auto-merge on Dependabot PRs for patch + minor updates only. MAJOR updates are left
# for a human. Auto-merge waits for the branch-protection REQUIRED status checks before merging, so
# this workflow is only as safe as main's branch protection (see wiring-rust-repo-automation skill):
# with no required checks, GitHub would merge the PR the instant it opens.
#
# Uses `pull_request` (NOT pull_request_target) + an explicit least-privilege permissions block, per
# GitHub's documented recipe. Dependabot PRs get a read-only token by default; the block below grants
# exactly the write scopes auto-merge needs and nothing else.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (patch + minor only)
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
