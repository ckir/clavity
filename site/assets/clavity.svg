<svg xmlns="http://www.w3.org/2000/svg" width="1647" height="928" viewBox="0 0 1647 928" role="img" aria-labelledby="title desc">
  <title id="title">Clavity — Claude Code CLI and Google Antigravity CLI bridge</title>
  <desc id="desc">A neon orange and cyan futuristic bridge connecting two terminal windows, with a square-edged Clavity wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020713"/><stop offset=".55" stop-color="#052b70"/><stop offset="1" stop-color="#001333"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffb14a"/><stop offset=".45" stop-color="#ff4b18"/><stop offset="1" stop-color="#ff7a24"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00eaff"/><stop offset=".5" stop-color="#087dff"/><stop offset="1" stop-color="#00d9ff"/>
    </linearGradient>
    <linearGradient id="bridgeStroke" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#b6aaff"/><stop offset=".48" stop-color="#00cfff"/><stop offset="1" stop-color="#00e9ff"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#061a4b" stop-opacity=".1"/><stop offset="1" stop-color="#020817" stop-opacity=".9"/>
    </linearGradient>
    <filter id="glowOrange" x="-60%" y="-60%" width="220%" height="220%">
