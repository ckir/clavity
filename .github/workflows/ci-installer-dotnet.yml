name: ci-installer-dotnet

# Continuous BUILD coverage for the dotnet member: build the per-RID clavity-ls binaries + run the validate
# gates (version consistency, seed + cheatsheet byte budgets) on every push[main]/PR that touches the member,
# its build workflow, this file, or the budget-check inputs. Delegates to the reusable build-dotnet.yml.
# (The Inno installer was RETIRED 2026-09-14 -> `claude plugin` + fetch-on-first-run; this file kept its name
# and job name to preserve the required-status-check identity.)
on:
  push:
    branches: [main]
    paths:
      - 'clavity-dotnet/**'
      - 'installer/_shared/**'
      - '.github/workflows/build-dotnet.yml'
      - '.github/workflows/ci-installer-dotnet.yml'
      - 'scripts/generate-scoped-manifest.ps1'
      - 'scripts/check-versions.ps1'
      # build-dotnet.yml runs check-seed-budget.ps1 and check-cheatsheet-budget.ps1, whose inputs are
      # these two files. build-dotnet.yml is workflow_call-only, so it fires ONLY via a caller like this
      # one - and no other workflow runs those budget checks. Without these entries, bloating the seed or
      # the cheatsheet past its cap merges green with the gate never having run.
      - 'seed/golden-header.md'
      - 'agy-autotrain/knowledge/driver-cheatsheet.core.md'
  pull_request:
    # No `branches:` filter — fires on PRs into any base branch (matches existing ci-*.yml).
    paths:
      - 'clavity-dotnet/**'
      - 'installer/_shared/**'
      - '.github/workflows/build-dotnet.yml'
      - '.github/workflows/ci-installer-dotnet.yml'
      - 'scripts/generate-scoped-manifest.ps1'
      - 'scripts/check-versions.ps1'
      # build-dotnet.yml runs check-seed-budget.ps1 and check-cheatsheet-budget.ps1, whose inputs are
      # these two files. build-dotnet.yml is workflow_call-only, so it fires ONLY via a caller like this
      # one - and no other workflow runs those budget checks. Without these entries, bloating the seed or
      # the cheatsheet past its cap merges green with the gate never having run.
      - 'seed/golden-header.md'
      - 'agy-autotrain/knowledge/driver-cheatsheet.core.md'

# Disposable CI run (never publishes) — cancel a superseded run rather than pile up on push-heavy main.
concurrency:
  group: ci-installer-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    uses: ./.github/workflows/build-dotnet.yml
